name: Validate JavaScript

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check changed application scripts
        run: |
          node --check auth-system.js
          node --check learning-stats-and-resources.js
          node --check student-home.js
          node --check teaching-engine.js
