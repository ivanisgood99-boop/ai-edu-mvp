        padding: 16px;

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));

      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
      .grid-5 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));

      }

        display: grid;
        grid-template-columns: repeat(3, 1fr);

        padding: 6px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 600;

        border: 1px solid #e2e8f0;
        background: #ffffff;
        color: #64748b;
      }
      .stage-pill.current {
        background: #047857;
        color: #ffffff;
        border-color: #047857;
      }
      .stage-pill.locked {
        background: #f1f5f9;
        color: #94a3b8;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 4px;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-primary {
        background: #047857;
        color: #ffffff;
      }
      .btn-primary:hover { background: #065f46; }

        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }
      .btn-warn {
        background: #fffbeb;
        color: #78350f;

      }
      .btn-danger {
        background: #e11d48;
        color: #ffffff;

      .mod-card {

        border: 1px solid #a7f3d0;
        background: #f0fdf4;
        cursor: pointer;
        width: 100%;
      }
      .mod-card.selected {
        background: #065f46;
        color: #ffffff;
        border-color: #065f46;
      }
      .mod-card.disabled {
        background: #f8fafc;
        color: #94a3b8;
        border-color: #f1f5f9;
        cursor: not-allowed;
      }
      .box-soft {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px;

      .box-good {
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #064e3b;
        border-radius: 12px;
        padding: 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .box-hint {
        background: #fffbeb;
        border: 1px solid #fde68a;
        color: #78350f;
        border-radius: 12px;
        padding: 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .box-err {
        background: #fff1f2;
        border: 1px solid #fecdd3;
        color: #881337;
        border-radius: 12px;
        padding: 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .row-item {
        padding: 10px 0;
        border-bottom: 1px solid #f1f5f9;
        font-size: 13px;
      }
      .row-item:last-child { border-bottom: 0; }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
      }
      .pill-ok { background: #dcfce7; color: #166534; }
      .pill-err { background: #fef3c7; color: #92400e; }
      #err-box {
        display: none;
        margin: 12px 0;
        padding: 12px;
        border: 1px solid #e11d48;
        background: #fff1f2;
        color: #881337;
        border-radius: 12px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }

        var errBox = document.getElementById("err-box");
        function showErr(msg) {
          if (!errBox) return;
          errBox.style.display = "block";
          errBox.textContent = msg;
        }
        function clearErr() {
          if (!errBox) return;
          errBox.style.display = "none";
          errBox.textContent = "";
        }

        window.onerror = function (message, source, lineno) {
          showErr("Error: " + message + (lineno ? " (Line " + lineno + ")" : ""));
        };
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          showErr("Promise Error: " + ((r && r.message) || r || "未知錯誤"));
        });

        async function sbRequest(table, method, queryStr, bodyObj) {
          var url = SUPABASE_URL + "/rest/v1/" + table + (queryStr ? "?" + queryStr : "");
          var headers = {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json"
          };
          if (method === "POST") {
            headers["Prefer"] = "resolution=merge-duplicates,return=representation";
          } else if (method === "PATCH") {
            headers["Prefer"] = "return=representation";
          }
          var resp = await fetch(url, {
            method: method || "GET",
            headers: headers,
            body: bodyObj ? JSON.stringify(bodyObj) : undefined
          });
          var text = await resp.text();
          var data = null;
          try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
          if (!resp.ok) {
            throw new Error((data && data.message) || text || ("HTTP " + resp.status));
          }
          return data;
        }

          E07: "E07 跨題型或情境轉換困難"
        };

        var COURSE_CATALOG = [
          { id: "M0", title: "M0 先備知識", status: "coming_soon", desc: "整數、分數、根式、次方、方程式" },

        var MODULE_DATA = {
          "M1-01": {
            id: "M1-01",
            title: "正整數指數",
            objectives: [
              "理解 a^n 代表 n 個 a 連續相乘，而非 a × n",
              "能正確辨識底數與指數，並計算正整數次方",
              "注意負數加括號與不加括號的運算差異"
            ],
            intuition: "就像細胞每次分裂成 2 個，分裂 4 次後總數是 2 × 2 × 2 × 2。數學家為了不寫一長串乘號，發明了右上角的「指數」來記錄連乘了幾次。",
            definition: "設 a 為任意實數，n 為正整數，則 a^n = a × a × ... × a（共 n 個 a 相乘）。其中 a 稱為底數，n 稱為指數。",
            derivation: "觀察規律：3^1 = 3；3^2 = 3 × 3 = 9；3^3 = 3^2 × 3 = 27；每當指數增加 1，整體數值就再乘以一次底數 3。",
            examples: [

            ],
            counterExamples: [
              "錯誤：2^4 = 2 × 4 = 8（指數是連乘次數，不是乘法）",
              "注意：-3^2 = -(3 × 3) = -9，與 (-3)^2 = 9 不同"
            ],
            guided: {
              prompt: "在進入正式題目之前，想請你用自己的話或算式回答：為什麼 (-2)^3 會是負數，但 (-2)^4 卻變成正數？",
              keywords: ["奇數", "偶數", "負", "正", "-8", "16", "三個", "四個"],
              hints: {

                H2: "兩個負號相乘會變正（負負得正），那 3 個負號與 4 個負號相乘分別會剩下什麼符號？",
                H3: "(-2)^3 = (-2)×(-2)×(-2) 有 3 個負號（奇數個）；(-2)^4 有 4 個負號（偶數個）。",
                H4: "奇數個負數相乘結果為負（-8），偶數個負數相乘結果為正（+16）。輸入「奇數個負號為負，偶數個為正」即可過關！"
              }
            },
            check: {
              prompt: "【觀念辨識】下列哪一個算式的值與 -5^2 相等？（請輸入選項代號 A、B 或 C）\nA. (-5)^2\nB. -(5 × 5)\nC. (-5) × 2",
              expected: "B",
              hints: {
                H1: "觀察負號有沒有被括號包起來，次方會優先作用在誰身上？",
                H2: "沒有括號時，次方只作用在數字 5 上，負號留在最前面。",
                H3: "-5^2 代表先算 5 的 2 次方，最後再加上負號，也就是 -(5 × 5)。",
                H4: "正確答案是 B，因為 -5^2 = -(5 × 5) = -25，而 A 是 +25。"

            },

                H1: "把兩項分開計算：先算 2 的 3 次方，再算 (-3) 的 2 次方。",

            remedial: {

            definition: "當底數 a ≠ 0 時，規定 a^0 = 1。若底數 a = 0，則 0^0 在數學上「不予定義（無意義）」。",
            derivation: "由同底數相除指數相減：a^n ÷ a^n = a^(n-n) = a^0；另一方面，任何非零數除以自己都等於 1，因此必須規定 a^0 = 1（a ≠ 0）。",
            examples: ["99^0 = 1", "(-4)^0 = 1"],
            counterExamples: [
              "錯誤：5^0 = 0（零次方不是乘以 0）",

            ],
            guided: {

              keywords: ["除", "自己", "1", "8÷8", "8/8", "規律", "減"],

              expected: "B",

              prompt: "【補救確認題】請計算 10^0 + (-2)^0 + 3^1 的值是多少？",

            }

          return String(s || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function getFutureDateStr(days) {

        }

          if (!ans) return { code: "E06", name: ERROR_CODES.E06 };

          if (modId === "M1-01") {
            if (stage === 3 && ans === "A") return { code: "E03", name: ERROR_CODES.E03 };

          if (modId === "M1-02") {
            if (stage === 3 && ans === "A") return { code: "E03", name: ERROR_CODES.E03 };
            if (stage === 3 && ans === "C") return { code: "E07", name: ERROR_CODES.E07 };

        async function saveProgressToDb(nextStage, mastery, extra) {
          if (!state.studentName.trim()) return;
          extra = extra || {};
          var activeCode = state.classCode.trim() || "MATH2026";
          var rowId = activeCode + "_" + state.studentName.trim() + "_" + state.selectedModId;
          var payload = {
            id: rowId,
            student_name: state.studentName.trim(),
            class_code: activeCode,
            module_id: state.selectedModId,
            current_stage: nextStage,
            mastery_level: mastery || "L1",

            updated_at: new Date().toISOString()
          };
          if (extra.scores) payload.scores = extra.scores;
          if (extra.day2) payload.review_day2 = extra.day2;
          if (extra.day7) payload.review_day7 = extra.day7;

          try {
            await sbRequest("student_progress", "POST", null, [payload]);
            state.syncNotice = "學習進度已同步至雲端";
          } catch (e) {
            state.syncNotice = "雲端同步異常：" + e.message;

          render();
