<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 個人化智慧教育平台 MVP — M1 驗收版</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:0 0 56px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:#f7f9f5;color:#1e293b;line-height:1.55}
    header{background:#fff;border-bottom:1px solid #d1fae5;position:sticky;top:0;z-index:20}
    .wrap{max-width:880px;margin:0 auto;padding:12px 16px}
    .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
    .tabs{display:flex;gap:4px;background:#ecfdf5;padding:4px;border-radius:12px}
    .tab{border:0;background:transparent;color:#064e3b;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
    .tab.on{background:#065f46;color:#fff}
    .card{background:#fff;border:1px solid #d1fae5;border-radius:16px;padding:16px;margin-bottom:14px}
    .btn{border:0;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;background:#047857;color:#fff;margin-right:6px;margin-top:6px}
    .btn-soft{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
    .btn-warn{background:#fffbeb;color:#78350f;border:1px solid #fde68a}
    .btn-red{background:#e11d48;color:#fff}
    input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;margin:6px 0 10px}
    .box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:10px 0;font-size:13px}
    .good{background:#ecfdf5;border-color:#a7f3d0;color:#064e3b}
    .hint{background:#fffbeb;border-color:#fde68a;color:#78350f}
    .errbox{background:#fff1f2;border-color:#fecdd3;color:#881337}
    .stages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
    @media(min-width:640px){.stages{grid-template-columns:repeat(6,1fr)}}
    .st{padding:6px;border-radius:8px;font-size:11px;font-weight:700;text-align:center;border:1px solid #e2e8f0;background:#fff;color:#64748b}
    .st.cur{background:#047857;color:#fff;border-color:#047857}
    .st.lock{background:#f1f5f9;color:#94a3b8}
    .grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
    #js-err{display:none;margin:12px 0;padding:12px;background:#fff1f2;border:1px solid #e11d48;color:#881337;border-radius:12px;font-size:12px;white-space:pre-wrap}
  </style>
  <script>
    window.onerror=function(m,u,l){
      var e=document.getElementById("js-err");
      if(e){e.style.display="block";e.textContent="JS Error: "+m+" (Line "+l+")";}
    };
  </script>
</head>
<body>
  <header>
    <div class="wrap row">
      <div><strong style="color:#064e3b">AI 個人化教育平台</strong> <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:#fef3c7;color:#78350f;font-weight:700">M1 驗收版</span></div>
      <div class="tabs">
        <button id="t-stu" class="tab on" onclick="switchRole('student')">學生學習</button>
        <button id="t-tea" class="tab" onclick="switchRole('teacher')">教師班級</button>
        <button id="t-adm" class="tab" onclick="switchRole('admin')">平台管理</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div id="js-err"></div>
    <div id="app" class="card">正在啟動驗收版...</div>
  </main>

<script>
(function(){
  var SB_URL = "https://antfbdsqrznnssdvpzcn.supabase.co";
  var SB_KEY = "sb_publishable_z7l4i49w93dZ0yrR5SPbVw_ShVGKm0J";
  var ADMIN_KEY = "ADMIN2026";

  var STAGE_LABELS = ["1.教材學習","2.引導問題","3.理解檢查","4.互動練習","5.個人化補救","6.學習總結"];

  var MODS = {
    "M1-01": {
      id: "M1-01",
      title: "M1-01 正整數指數",
      teach: [
        "【學習目標】理解 a^n 代表 n 個 a 連乘（非 a×n），注意負數括號與無括號差異。",
        "【直覺與定義】a 為底數、n 為正整數時，a^n = a × a × ... × a（共 n 個 a 連乘）。",
        "【範例與迷思】2^4 = 16；(-3)^2 = 9，但 -3^2 = -(3×3) = -9；2^4 ≠ 2×4。"
      ].join("\n"),
      s2Q: "【階段二 引導】為什麼 (-2)^3 是負數，但 (-2)^4 卻是正數？請簡述原因。",
      s2Kw: ["奇數","偶數","負","正","-8","16","三個","四個"],
      s3Q: "【階段三 理解檢查】下列哪一個與 -5^2 相等？（輸入 A、B 或 C）\nA. (-5)^2\nB. -(5 × 5)\nC. (-5) × 2",
      s3A: "B",
      s4Q: "【階段四 互動練習】請計算：2^3 + (-3)^2 的值是多少？",
      s4A: "17",
      s5Note: "【補救重點】(-a)^n 連同負號連乘 n 次；-a^n 先算次方再加負號。",
      s5Q: "【階段五 補救確認】請計算 (-2)^3 + 3^2 的值是多少？",
      s5A: "1",
      hints: {
        H1: "先把次方展開成連乘，看看負號有幾個、括號包住了誰。",
        H2: "奇數個負號相乘為負，偶數個負號相乘為正；沒括號時次方只作用在底數。",
        H3: "2^3 = 8，(-3)^2 = (-3)×(-3) = 9；-5^2 = -(5×5) = -25。",
        H4: "引導可答「奇數為負、偶數為正」；檢查選 B；練習答案為 17。"
      }
    },
    "M1-02": {
      id: "M1-02",
      title: "M1-02 零指數",
      teach: [
        "【學習目標】理解 a ≠ 0 時規定 a^0 = 1，並辨識 0^0 無意義的必要條件。",
        "【直覺與定義】指數每減 1 相當於除以底數；a ≠ 0 時 a^0 = 1，若 a = 0 則 0^0 無意義。",
        "【範例與迷思】99^0 = 1、(-4)^0 = 1；5^0 ≠ 0，且 0^0 不可寫成 1。"
      ].join("\n"),
      s2Q: "【階段二 引導】若有人說 8^0 = 0，你會如何用除法規律說明為什麼 8^0 = 1？",
      s2Kw: ["除","自己","1","8÷8","8/8","規律","減"],
      s3Q: "【階段三 理解檢查】若 (x - 3)^0 = 1 成立，x 必須滿足什麼條件？（輸入 A、B 或 C）\nA. 任意實數\nB. x ≠ 3\nC. x > 3",
      s3A: "B",
      s4Q: "【階段四 互動練習】請計算：(-6)^0 + 2^3 - 5^0 的值是多少？",
      s4A: "8",
      s5Note: "【補救重點】只要底數不是 0，任何數的 0 次方都等於 1（例如 (-6)^0 = 1）。",
      s5Q: "【階段五 補救確認】請計算 10^0 + (-2)^0 + 3^1 的值是多少？",
      s5A: "5",
      hints: {
        H1: "回想非零數除以自己等於 1，且底數不能為 0。",
        H2: "8^1 ÷ 8^1 = 8^0 = 1；底數 (x - 3) 必須不等於 0。",
        H3: "(-6)^0 = 1，5^0 = 1，2^3 = 8，算式為 1 + 8 - 1。",
        H4: "引導可答「自己除以自己為 1」；檢查選 B；練習答案為 8。"
      }
    }
  };

  var st = {
    role: "student",
    name: localStorage.getItem("edu_student_name") || "",
    code: localStorage.getItem("edu_class_code") || "MATH2026",
    modId: "M1-01",
    stage: 1,
    tries: 0,
    hadErr: false,
    msg: "",
    msgKind: "good",
    needRef: false,
    lastLogId: null,
    tName: localStorage.getItem("edu_teacher_name") || "",
    tApproved: false,
    adminOk: sessionStorage.getItem("edu_admin_ok") === "1"
  };

  function esc(s){
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function futureDate(days){
    var d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,10);
  }

  function diagCode(modId, stage, ans){
    var u = String(ans||"").trim().toUpperCase();
    if(!u) return "E06";
    if(stage === 2) return u.length < 3 ? "E06" : "E05";
    if(stage === 3 && u === "A") return "E03";
    if(stage === 3 && u === "C") return modId === "M1-02" ? "E07" : "E01";
    if(stage === 4 && (u === "14" || u === "0" || u === "-1")) return "E02";
    return "E04";
  }

  function api(tbl, method, q, body){
    var h = {
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Content-Type": "application/json"
    };
    if(method === "POST") h["Prefer"] = "resolution=merge-duplicates,return=representation";
    if(method === "PATCH") h["Prefer"] = "return=representation";
    return fetch(SB_URL + "/rest/v1/" + tbl + (q ? "?" + q : ""), {
      method: method || "GET",
      headers: h,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      return r.text().then(function(t){
        if(!r.ok) throw new Error("HTTP " + r.status + " " + t);
        return t ? JSON.parse(t) : null;
      });
    });
  }

  function saveProg(sNum, lv, isFinal){
    if(!st.name.trim()) return Promise.resolve();
    var payload = {
      id: (st.code.trim() || "MATH2026") + "_" + st.name.trim() + "_" + st.modId,
      student_name: st.name.trim(),
      class_code: st.code.trim() || "MATH2026",
      module_id: st.modId,
      current_stage: sNum,
      mastery_level: lv,
      need_remedial: !isFinal && st.hadErr,
      updated_at: new Date().toISOString()
    };
    if(isFinal){
      payload.scores = st.hadErr
        ? {concept:75,calc:80,logic:75,transfer:70,indep:75}
        : {concept:95,calc:90,logic:90,transfer:85,indep:95};
      payload.review_day2 = futureDate(2);
      payload.review_day7 = futureDate(7);
    }
    return api("student_progress", "POST", null, [payload])
      .then(function(){ st.msg = "已同步至雲端（階段 " + sNum + "）"; st.msgKind = "good"; render(); })
      .catch(function(e){ st.msg = "同步失敗：" + e.message; st.msgKind = "errbox"; render(); });
  }

  function saveLog(qTxt, ansTxt, ok, errC, hLv){
    if(!st.name.trim()) return Promise.resolve(null);
    return api("answer_logs", "POST", null, [{
      student_name: st.name.trim(),
      class_code: st.code.trim() || "MATH2026",
      module_id: st.modId,
      stage: st.stage,
      prompt_text: qTxt,
      student_answer: ansTxt,
      is_correct: ok,
      error_code: errC || null,
      hint_level: hLv || null
    }]).then(function(rows){
      return (rows && rows[0] && rows[0].id) ? rows[0].id : null;
    }).catch(function(e){
      st.msg = "作答紀錄寫入失敗：" + e.message;
      st.msgKind = "errbox";
      render();
      return null;
    });
  }

  function render(){
    var app = document.getElementById("app");
    var m = MODS[st.modId];
    var h = "";

    if(st.role === "student"){
      h += "<div class='card'>" +
        "<label>學生姓名（必填）</label><input id='i-name' value='" + esc(st.name) + "' placeholder='例如：陳小華'>" +
        "<label>班級邀請碼</label><input id='i-code' value='" + esc(st.code) + "'>" +
        "<button class='btn " + (st.modId==="M1-01"?"":"btn-soft") + "' onclick='pickMod(\"M1-01\")'>M1-01 正整數指數</button>" +
        "<button class='btn " + (st.modId==="M1-02"?"":"btn-soft") + "' onclick='pickMod(\"M1-02\")'>M1-02 零指數</button>" +
        "<button class='btn btn-soft' onclick='pullProg()'>讀取雲端進度</button>" +
        (st.msg ? "<div class='box " + st.msgKind + "'>" + esc(st.msg) + "</div>" : "") +
        "</div>";

      h += "<div class='card'><div class='row'><strong>" + esc(m.title) + "</strong>" +
        (st.stage > 1 ? "<span style='font-size:11px;color:#92400e;font-weight:700'>教材已鎖定</span>" : "") + "</div>";

      h += "<div class='stages'>";
      for(var i=0;i<6;i++){
        var sn = i+1;
        var cls = "st" + (st.stage===sn?" cur":(st.stage>sn?" lock":""));
        h += "<div class='" + cls + "'>" + (st.stage>sn?"🔒 ":"") + STAGE_LABELS[i] + "</div>";
      }
      h += "</div>";

      if(st.stage === 1){
        h += "<div class='box' style='white-space:pre-line'>" + esc(m.teach) + "</div>" +
          "<button class='btn' onclick='goStage2()'>我已理解教材，進入階段二（不可回看）</button>";
      } else if(st.stage >= 2 && st.stage <= 5){
        var q = st.stage===2?m.s2Q:(st.stage===3?m.s3Q:(st.stage===4?m.s4Q:m.s5Q));
        h += (st.stage===5 ? "<div class='box hint'>" + esc(m.s5Note) + "</div>" : "") +
          "<div class='box' style='white-space:pre-line;font-weight:700'>" + esc(q) + "</div>" +
          "<input id='i-ans' placeholder='請輸入作答或答案'>" +
          "<button class='btn' onclick='sendAns()'>送出作答</button>";
        if(st.needRef){
          h += "<div class='box'><strong>錯誤自評：</strong><br>" +
            "<button class='btn btn-soft' onclick='doRef(\"觀念還不清楚\")'>觀念還不清楚</button>" +
            "<button class='btn btn-soft' onclick='doRef(\"看錯題目或計算不小心\")'>看錯題目或計算不小心</button>" +
            "<button class='btn btn-soft' onclick='doRef(\"不確定自己為什麼這樣回答\")'>不確定原因</button></div>";
        }
      } else {
        var lv = st.hadErr ? "L3" : "L4";
        h += "<div class='box good'><strong>單元學習總結</strong><br>精熟等級：<strong>" + lv + "</strong>" +
          "<br>間隔複習排程：第 2 天 <strong>" + futureDate(2) + "</strong> ｜ 第 7 天 <strong>" + futureDate(7) + "</strong></div>" +
          "<div class='grid5'>" +
          "<div class='box good'>概念理解<br><strong>" + (st.hadErr?75:95) + "%</strong></div>" +
          "<div class='box good'>數學運算<br><strong>" + (st.hadErr?80:90) + "%</strong></div>" +
          "<div class='box good'>推理能力<br><strong>" + (st.hadErr?75:90) + "%</strong></div>" +
          "<div class='box good'>應用遷移<br><strong>" + (st.hadErr?70:85) + "%</strong></div>" +
          "<div class='box good'>獨立完成<br><strong>" + (st.hadErr?75:95) + "%</strong></div></div>" +
          "<button class='btn btn-soft' onclick='resetLocal()'>重新測試本單元</button>";
      }
      h += "</div>";
    } else if(st.role === "teacher"){
      h += "<div class='card'><h3>教師班級專區（限已核准教師）</h3>" +
        "<label>已核准教師姓名</label><input id='i-tname' value='" + esc(st.tName) + "' placeholder='輸入已核准教師姓名'>" +
        "<button class='btn' onclick='verifyTeacher()'>驗證並讀取班級</button>" +
        "<div id='t-out' class='box'>請輸入已核准教師姓名並驗證。</div></div>";
    } else {
      if(!st.adminOk){
        h += "<div class='card'><h3>平台管理後台（僅限管理員）</h3>" +
          "<label>管理員密鑰</label><input id='i-akey' type='password' placeholder='輸入管理員密鑰'>" +
          "<button class='btn' onclick='unlockAdmin()'>解鎖管理後台</button>" +
          (st.msg ? "<div class='box errbox'>" + esc(st.msg) + "</div>" : "") + "</div>";
      } else {
        h += "<div class='card'><div class='row'><strong>平台管理後台（已解鎖）</strong>" +
          "<button class='btn btn-soft' onclick='lockAdmin()'>鎖定</button></div>" +
          "<label style='margin-top:10px'>新增教師資格申請</label><input id='i-at' placeholder='輸入教師姓名'>" +
          "<button class='btn' onclick='addTeacher()'>送出申請</button>" +
          "<div id='a-out' class='box'>載入中...</div></div>";
      }
    }

    app.innerHTML = h;
    var iname = document.getElementById("i-name");
    if(iname) iname.addEventListener("input", function(e){ st.name = e.target.value; localStorage.setItem("edu_student_name", st.name); });
    var icode = document.getElementById("i-code");
    if(icode) icode.addEventListener("input", function(e){ st.code = e.target.value; localStorage.setItem("edu_class_code", st.code); });
    var itname = document.getElementById("i-tname");
    if(itname) itname.addEventListener("input", function(e){ st.tName = e.target.value; localStorage.setItem("edu_teacher_name", st.tName); });

    if(st.role === "teacher" && st.tApproved) verifyTeacher();
    if(st.role === "admin" && st.adminOk) loadAdmin();
  }

  window.switchRole = function(r){
    st.role = r; st.msg = "";
    document.getElementById("t-stu").classList.toggle("on", r==="student");
    document.getElementById("t-tea").classList.toggle("on", r==="teacher");
    document.getElementById("t-adm").classList.toggle("on", r==="admin");
    render();
  };

  window.pickMod = function(id){
    st.modId = id; st.stage = 1; st.tries = 0; st.hadErr = false; st.needRef = false; st.msg = "";
    render();
  };

  window.resetLocal = function(){
    st.stage = 1; st.tries = 0; st.hadErr = false; st.needRef = false; st.msg = "";
    render();
  };

  window.pullProg = function(){
    if(!st.name.trim()){ st.msg = "請先輸入學生姓名"; st.msgKind = "errbox"; render(); return; }
    var id = (st.code.trim() || "MATH2026") + "_" + st.name.trim() + "_" + st.modId;
    api("student_progress", "GET", "id=eq." + encodeURIComponent(id) + "&limit=1")
      .then(function(rows){
        if(rows && rows[0]){
          st.stage = rows[0].current_stage || 1;
          st.hadErr = Boolean(rows[0].need_remedial);
          st.msg = "已恢復雲端進度：第 " + st.stage + " 階段";
          st.msgKind = "good";
        } else {
          st.msg = "查無此單元雲端進度";
          st.msgKind = "hint";
        }
        render();
      });
  };

  window.goStage2 = function(){
    if(!st.name.trim()){ st.msg = "請先輸入學生姓名"; st.msgKind = "errbox"; render(); return; }
    st.stage = 2; st.tries = 0; st.needRef = false;
    render();
    saveProg(2, "L1", false);
  };

  window.sendAns = function(){
    if(!st.name.trim()){ st.msg = "請先輸入學生姓名"; st.msgKind = "errbox"; render(); return; }
    var el = document.getElementById("i-ans");
    var v = el ? el.value.trim() : "";
    if(!v) return;
    var m = MODS[st.modId];
    st.tries += 1;
    var hLv = ["H1","H2","H3","H4"][Math.min(st.tries-1, 3)];

    if(st.stage === 2){
      var ok2 = m.s2Kw.some(function(k){ return v.toLowerCase().indexOf(k.toLowerCase()) !== -1; });
      saveLog(m.s2Q, v, ok2, ok2?null:diagCode(st.modId,2,v), ok2?null:hLv).then(function(lid){
        st.lastLogId = lid;
        if(ok2){ st.stage = 3; st.tries = 0; st.needRef = false; st.msg = "引導通過，進入階段三"; st.msgKind = "good"; render(); saveProg(3,"L2",false); }
        else { st.hadErr = true; st.needRef = true; st.msg = "[" + hLv + "] " + m.hints[hLv]; st.msgKind = "hint"; render(); }
      });
    } else if(st.stage === 3){
      var ok3 = v.toUpperCase() === m.s3A;
      saveLog(m.s3Q, v, ok3, ok3?null:diagCode(st.modId,3,v), ok3?null:hLv).then(function(lid){
        st.lastLogId = lid;
        if(ok3){ st.stage = 4; st.tries = 0; st.needRef = false; st.msg = "理解檢查通過，進入階段四"; st.msgKind = "good"; render(); saveProg(4,"L2",false); }
        else { st.hadErr = true; st.needRef = true; st.msg = "[" + hLv + "] " + m.hints[hLv]; st.msgKind = "hint"; render(); }
      });
    } else if(st.stage === 4){
      var ok4 = v === m.s4A;
      saveLog(m.s4Q, v, ok4, ok4?null:diagCode(st.modId,4,v), ok4?null:hLv).then(function(lid){
