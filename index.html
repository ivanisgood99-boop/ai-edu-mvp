<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星航智學・AI 個人化教育平台</title>
  <link rel="stylesheet" href="./student-home.css" />
  <link rel="stylesheet" href="./teaching-engine.css" />
</head>
<body>
  <div class="sh-shell">
    <nav class="sh-nav-card" aria-label="主要功能導覽">
      <div class="sh-nav-brand">
        <strong>✦ 星航智學</strong>
        <span class="sh-nav-pill">108課綱・南一版高一上</span>
      </div>
      <div class="sh-nav-bar" id="mainNavBar">
        <button type="button" class="sh-nav-btn" data-nav="studentHome">學生首頁</button>
        <button type="button" class="sh-nav-btn" data-nav="learningMap">學習地圖</button>
        <button type="button" class="sh-nav-btn" data-nav="teacher">教師班級</button>
        <button type="button" class="sh-nav-btn" data-nav="admin">平台管理</button>
      </div>
    </nav>

    <main class="sh-stage-main" id="mainStage"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.SUPABASE_URL = "https://antfbdsqrznnssdvpzcn.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_z7l4i49w93dZ0yrR5SPbVw_ShVGKm0J";
  </script>
  <script src="./curriculum-data.js"></script>
  <script src="./auth-system.js"></script>
  <script src="./learning-stats-and-resources.js"></script>
  <script src="./teaching-engine.js"></script>
  <script src="./student-home.js"></script>
  <script>
    (function () {
      var NAV_STORAGE_KEY = "ai_edu_active_nav_v1";
      var VALID_NAVS = ["studentHome", "learningMap", "teacher", "admin"];

      function readSavedNav() {
        try {
          var v = localStorage.getItem(NAV_STORAGE_KEY);
          return VALID_NAVS.indexOf(v) !== -1 ? v : "studentHome";
        } catch (e) {
          return "studentHome";
        }
      }

      var currentNav = readSavedNav();

      function syncNavVisualState(navKey) {
        currentNav = VALID_NAVS.indexOf(navKey) !== -1 ? navKey : "studentHome";
        try { localStorage.setItem(NAV_STORAGE_KEY, currentNav); } catch (e) {}
        var btns = document.querySelectorAll("#mainNavBar .sh-nav-btn");
        btns.forEach(function (btn) {
          var isSel = btn.getAttribute("data-nav") === currentNav;
          btn.classList.toggle("is-active", isSel);
          if (isSel) {
            btn.setAttribute("aria-current", "page");
          } else {
            btn.removeAttribute("aria-current");
          }
        });
      }

      window.__onStudentSubViewChange = function (subKey) {
        if (VALID_NAVS.indexOf(subKey) !== -1) {
          syncNavVisualState(subKey);
        }
      };

      function renderStage(navKey) {
        syncNavVisualState(navKey);
        var stage = document.getElementById("mainStage");
        if (!stage) return;

        if (currentNav === "studentHome" || currentNav === "learningMap") {
          stage.innerHTML = "<div id=\"shStudentStage\"></div>";
          if (window.StudentHomeModule && typeof window.StudentHomeModule.render === "function") {
            window.StudentHomeModule.render(document.getElementById("shStudentStage"), {
              subView: currentNav === "learningMap" ? "map" : "home"
            });
          }
          return;
        }

        if (currentNav === "teacher") {
          stage.innerHTML =
            "<div class=\"sh-panel\">" +
            "<h2 style=\"margin:0 0 8px\">教師班級</h2>" +
            "<p style=\"margin:0;font-size:13px;color:#cbd5e1\">教師班級檢視與授權班級名單功能依正式帳號與權限驗證運作，目前未開啟未授權資料。</p>" +
            "</div>";
          return;
        }

        stage.innerHTML =
          "<div class=\"sh-panel\">" +
          "<h2 style=\"margin:0 0 8px\">平台管理</h2>" +
          "<p style=\"margin:0;font-size:13px;color:#cbd5e1\">平台管理操作需透過受信任後端與管理權限驗證，前端不寫死管理員密鑰。</p>" +
          "</div>";
      }

      document.getElementById("mainNavBar").addEventListener("click", function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest(".sh-nav-btn") : null;
        if (!btn) return;
        var targetNav = btn.getAttribute("data-nav");
        if (targetNav) renderStage(targetNav);
      });

      renderStage(currentNav);
    })();
  </script>
</body>
</html>
