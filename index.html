<script>
var S = {
  tab: "student",
  studentView: "home",
  preferredNode: "CH2-L1",
  stu: localStorage.getItem("edu_stu") || "",
  code: localStorage.getItem("edu_code") || "MATH2026"
};

function goTab(t) {
  S.tab = t;
  if (t === "student") S.studentView = "home";
  render();
}

window.__openTeachingEngineForNode = function (nodeOrLevelId) {
  S.preferredNode = nodeOrLevelId || "CH2-L1";
  S.studentView = "practice";
  render();
};

function render() {
  var v = document.getElementById("view");
  if (!v) return;

  if (S.tab === "student" && S.studentView === "home") {
    if (window.StudentHomeModule && typeof window.StudentHomeModule.render === "function") {
      window.StudentHomeModule.render(v);
      return;
    }
    v.innerHTML =
      "<div style='background:#0b1228;color:#f8fafc;padding:18px;border-radius:12px'>" +
      "<h3 style='margin:0 0 8px;color:#38bdf8'>宇宙探索地圖</h3>" +
      "<p style='margin:0 0 12px;color:#cbd5e1'>請先點選下方關卡進入學習：</p>" +
      "<button type='button' class='btn' onclick='window.__openTeachingEngineForNode(\"CH2-L1\")'>進入 Stage 1-1（CH2-L1）</button>" +
      "</div>";
    return;
  }

  if (S.tab === "student" && S.studentView === "practice") {
    v.innerHTML =
      "<div>" +
      "<button type='button' class='btn btn-soft' onclick='S.studentView=\"home\";render()'>← 回到宇宙探索地圖</button>" +
      "<div id='te-mount' style='margin-top:12px'>載入教學引擎中...</div>" +
      "</div>";
    if (window.TeachingEngineModule && typeof window.TeachingEngineModule.render === "function") {
      window.TeachingEngineModule.render(document.getElementById("te-mount"), S.preferredNode);
    }
    return;
  }

  v.innerHTML = "<div>目前切換到：" + S.tab + "</div>";
}

render();
</script>
