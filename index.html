<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 個人化教育平台</title>
  <style>
    body{margin:0;padding:16px;font-family:sans-serif;background:#f7f9f5;color:#1e293b}
    .card{max-width:780px;margin:0 auto 12px;background:#fff;border:1px solid #d1fae5;border-radius:14px;padding:16px}
    .btn{border:0;border-radius:8px;padding:8px 12px;background:#047857;color:#fff;font-weight:700;cursor:pointer;margin-right:6px;margin-top:6px}
    .btn-gray{background:#e2e8f0;color:#1e293b}
    input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 10px;font-size:14px}
    #err{display:none;max-width:780px;margin:0 auto 12px;padding:10px;background:#fff1f2;border:1px solid #e11d48;color:#881337;border-radius:10px;font-size:12px;white-space:pre-wrap}
  </style>
  <script>
    window.onerror = function(m, u, l){
      var e = document.getElementById("err");
      if(e){ e.style.display = "block"; e.textContent = "JS錯誤: " + m + " (第" + l + "行)"; }
    };
  </script>
</head>
<body>
  <div id="err"></div>
  <div class="card">
    <strong style="color:#064e3b">AI 個人化教育平台</strong><br>
    <button class="btn" onclick="setTab('student')">學生學習</button>
    <button class="btn btn-gray" onclick="setTab('teacher')">教師班級</button>
    <button class="btn btn-gray" onclick="setTab('admin')">平台管理</button>
  </div>
  <div id="box" class="card">初始化中...</div>

<script>
var SB_URL = "https://antfbdsqrznnssdvpzcn.supabase.co";
var SB_KEY = "sb_publishable_z7l4i49w93dZ0yrR5SPbVw_ShVGKm0J";
var ADMIN_KEY = "ADMIN2026";
var curTab = "student";
var adminUnlocked = false;

function req(table, method, query, body){
  var opt = {
    method: method || "GET",
    headers: {
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Content-Type": "application/json"
    }
  };
  if(method === "POST") opt.headers["Prefer"] = "resolution=merge-duplicates,return=representation";
  if(method === "PATCH") opt.headers["Prefer"] = "return=representation";
  if(body) opt.body = JSON.stringify(body);
  return fetch(SB_URL + "/rest/v1/" + table + (query ? "?" + query : ""), opt)
    .then(function(r){ return r.text().then(function(t){ return { ok: r.ok, status: r.status, text: t }; }); });
}

function setTab(t){
  curTab = t;
  var errEl = document.getElementById("err");
  if(errEl){ errEl.style.display = "none"; errEl.textContent = ""; }
  draw();
}

function draw(){
  var box = document.getElementById("box");
  if(curTab === "student"){
    box.innerHTML =
      "<h3>學生學習（M1-01 正整數指數）</h3>" +
      "<label>學生姓名</label><input id='sName' placeholder='例如：陳小華'>" +
      "<label>請計算 2^3 + (-3)^2 的值是多少？</label><input id='sAns' placeholder='輸入答案'>" +
      "<button class='btn' onclick='submitAns()'>送出並存檔</button>" +
      "<div id='sMsg' style='margin-top:10px;font-size:13px;color:#047857'></div>";
  } else if(curTab === "teacher"){
    box.innerHTML =
      "<h3>教師班級（限已核准教師）</h3>" +
      "<label>輸入已核准的教師姓名</label><input id='tName' placeholder='輸入教師姓名'>" +
      "<button class='btn' onclick='checkTeacher()'>驗證並查看班級</button>" +
      "<div id='tMsg' style='margin-top:10px;font-size:13px'></div>";
  } else {
    if(!adminUnlocked){
      box.innerHTML =
        "<h3>平台管理（僅限管理員）</h3>" +
        "<label>管理員密鑰</label><input id='aKey' type='password' placeholder='輸入管理員密鑰'>" +
        "<button class='btn' onclick='unlockAdmin()'>解鎖</button>" +
        "<div id='aMsg' style='margin-top:10px;font-size:13px;color:#b91c1c'></div>";
    } else {
      box.innerHTML =
        "<h3>平台管理後台</h3>" +
        "<label>新增教師資格申請</label><input id='newT' placeholder='輸入新教師姓名'>" +
        "<button class='btn' onclick='addTeacher()'>送出申請</button>" +
        "<button class='btn btn-gray' onclick='adminUnlocked=false;draw()'>鎖定</button>" +
        "<div id='aList' style='margin-top:12px;font-size:13px'>載入中...</div>";
      loadAdmin();
    }
  }
}

function submitAns(){
  var name = document.getElementById("sName").value.trim();
  var ans = document.getElementById("sAns").value.trim();
  var msg = document.getElementById("sMsg");
  if(!name){ msg.textContent = "請先輸入學生姓名"; return; }
  var ok = (ans === "17");
  msg.textContent = ok ? "答對了（17）！正在寫入雲端..." : "提示：2^3 = 8，(-3)^2 = 9，相加是多少？正在記錄作答...";
  req("answer_logs", "POST", null, [{
    student_name: name, class_code: "MATH2026", module_id: "M1-01",
    stage: 4, prompt_text: "2^3 + (-3)^2", student_answer: ans, is_correct: ok
  }]).then(function(){
    return req("student_progress", "POST", null, [{
      id: "MATH2026_" + name + "_M1-01", student_name: name, class_code: "MATH2026",
      module_id: "M1-01", current_stage: ok ? 6 : 4, mastery_level: ok ? "L4" : "L2",
      updated_at: new Date().toISOString()
    }]);
  }).then(function(r){
    msg.textContent = r.ok ? "已同步至雲端！" : ("寫入失敗：" + r.text);
  });
}

function checkTeacher(){
  var tn = document.getElementById("tName").value.trim();
  var tMsg = document.getElementById("tMsg");
  if(!tn){ tMsg.textContent = "請輸入教師姓名"; return; }
  tMsg.textContent = "驗證中...";
  req("teacher_applications", "GET", "teacher_name=eq." + encodeURIComponent(tn) + "&order=created_at.desc&limit=1")
    .then(function(r){
      var list = r.ok && r.text ? JSON.parse(r.text) : [];
      if(!list.length || list[0].status !== "approved"){
        tMsg.innerHTML = "<span style='color:#b91c1c'>此姓名尚未通過管理員核准，無法查看班級資料。</span>";
        return;
      }
      req("student_progress", "GET", "order=updated_at.desc&limit=20").then(function(pr){
        var rows = pr.ok && pr.text ? JSON.parse(pr.text) : [];
        tMsg.innerHTML = "<strong>已核准教師：" + tn + "</strong><br>" +
          (rows.length ? rows.map(function(x){ return "• " + x.student_name + "（" + x.module_id + "・階段" + x.current_stage + "・" + x.mastery_level + "）"; }).join("<br>") : "尚無學生紀錄");
      });
    });
}

function unlockAdmin(){
  var k = document.getElementById("aKey").value.trim();
  if(k === ADMIN_KEY){ adminUnlocked = true; draw(); }
  else { document.getElementById("aMsg").textContent = "密鑰錯誤"; }
}

function addTeacher(){
  var nt = document.getElementById("newT").value.trim();
  if(!nt) return;
  req("teacher_applications", "POST", null, [{ teacher_name: nt, subject: "高中數學", status: "pending" }])
    .then(function(){ return req("audit_logs", "POST", null, [{ action: "APPLY_TEACHER", target_info: nt }]); })
    .then(function(){ loadAdmin(); });
}

function loadAdmin(){
  var aList = document.getElementById("aList");
  req("teacher_applications", "GET", "order=created_at.desc&limit=20").then(function(r){
    var apps = r.ok && r.text ? JSON.parse(r.text) : [];
    aList.innerHTML = "<strong>教師申請列表</strong><br>" + (apps.length ? apps.map(function(a){
      var btns = a.status === "pending"
        ? " <button class='btn' style='padding:4px 8px;font-size:11px' onclick='decide(" + a.id + ",\"approved\")'>核准</button>" +
          " <button class='btn btn-gray' style='padding:4px 8px;font-size:11px' onclick='decide(" + a.id + ",\"rejected\")'>拒絕</button>"
        : "";
      return "<div style='padding:6px 0;border-bottom:1px solid #eee'>" + a.teacher_name + "（" + a.status + "）" + btns + "</div>";
    }).join("") : "尚無申請");
  });
}

function decide(id, st){
  req("teacher_applications", "PATCH", "id=eq." + id, { status: st })
    .then(function(){ return req("audit_logs", "POST", null, [{ action: "TEACHER_" + st.toUpperCase(), target_info: "id=" + id }]); })
    .then(function(){ loadAdmin(); });
}

draw();
</script>
</body>
</html>
