<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 個人化教育平台 - AI 教師微技能版 (M1)</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:#f7f9f5;color:#1e293b;line-height:1.55}
    .wrap{max-width:840px;margin:0 auto}
    .card{background:#fff;border:1px solid #d1fae5;border-radius:14px;padding:16px;margin-bottom:12px}
    .btn{border:0;border-radius:8px;padding:8px 13px;background:#047857;color:#fff;font-weight:700;cursor:pointer;margin-right:6px;margin-top:6px;font-size:13px}
    .btn-soft{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
    .btn-warn{background:#fffbeb;color:#78350f;border:1px solid #fde68a}
    input,textarea{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 10px;font-size:14px;font-family:inherit}
    .box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:11px;margin:10px 0;font-size:13px;white-space:pre-line}
    .good{background:#ecfdf5;border-color:#a7f3d0;color:#064e3b}
    .hint{background:#fffbeb;border-color:#fde68a;color:#78350f}
    .diag{background:#fff1f2;border-color:#fecdd3;color:#881337}
    .skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:8px 0}
    .sk-item{border:1px solid #d1fae5;background:#f0fdf4;border-radius:10px;padding:9px;text-align:left;cursor:pointer;font-size:12px}
    .sk-item.active{background:#065f46;color:#fff;border-color:#065f46}
    #err{display:none;padding:10px;background:#fff1f2;border:1px solid #e11d48;color:#881337;border-radius:10px;font-size:12px;margin-bottom:12px;white-space:pre-wrap}
  </style>
  <script>
    window.onerror=function(m,u,l){
      var e=document.getElementById("err");
      if(e){e.style.display="block";e.textContent="JS錯誤: "+m+" (第"+l+"行)";}
    };
  </script>
</head>
<body>
<div class="wrap">
  <div id="err"></div>
  <div class="card">
    <strong style="color:#064e3b">AI 個人化教育平台</strong>
    <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:#fef3c7;color:#78350f;font-weight:700">AI 教師引導版・M1</span><br>
    <button class="btn" onclick="goTab('student')">學生學習</button>
    <button class="btn btn-soft" onclick="goTab('teacher')">教師班級</button>
    <button class="btn btn-soft" onclick="goTab('admin')">平台管理</button>
  </div>
  <div id="view" class="card">正在啟動 AI 教師引擎...</div>
</div>

<script>
var SB_URL="https://antfbdsqrznnssdvpzcn.supabase.co";
var SB_KEY="sb_publishable_z7l4i49w93dZ0yrR5SPbVw_ShVGKm0J";
var ADMIN_KEY="ADMIN2026";

/* 微技能節點設定：每個節點包含「概念與反例」、「單一核心問題」、「四層提示」、與「完成檢核（基本＋變化＋理由）」 */
var SKILLS={
  "M1-01A":{
    id:"M1-01A",
    title:"M1-01a 連乘意義與底數",
    concept:"【觀念起點】指數 a^n 表示「n 個 a 連續相乘」，底數是 a，指數是連乘次數 n。\n• 正例：2^4 = 2 × 2 × 2 × 2 = 16\n• 反例：2^4 ≠ 2 × 4（不是乘以 4）",
    coreQ:"【核心問題 1/1】先確認起點：若某數連續相乘 3 次，每次都乘以 5，這可以寫成哪一個指數算式，它的值是多少？（請寫出算式與數值，例如 2^3 = 8）",
    checkAns:function(v){ return v.indexOf("5^3")!==-1 && v.indexOf("125")!==-1; },
    varQ:"【變化題】若底數是 3，指數是 4，它的值比 3^3 大多少？請算出數值並用一句話說明理由。",
    varCheckAns:function(v){ return v.indexOf("54")!==-1; },
    reasonKw:["3^4","81","27","乘","次","多","少"],
    diagFn:function(v){
      if(v.indexOf("15")!==-1) return "可能把「3 個 5 相乘」誤算成「3 × 5 = 15」";
      return "尚未同時寫出正確次方表示法與計算結果";
    },
    hints:{
      1:"Level 1（提醒觀念）：次方代表「連續相乘的次數」，底數是被連乘的數字。",
      2:"Level 2（思考方向）：底數是 5，連乘 3 次，先寫出 5 的幾次方，再算算看 5×5×5。",
      3:"Level 3（部分步驟）：5^1=5，5^2=25，再乘一次 5 就是 25×5。",
      4:"Level 4（完整示範）：5 連乘 3 次是 5^3 = 5 × 5 × 5 = 125。請照這個格式輸入一次即可進入變化題。"
    }
  },
  "M1-01B":{
    id:"M1-01B",
    title:"M1-01b 括號與負號辨識",
    concept:"【觀念起點】次方只作用在緊鄰的對象上：\n• (-3)^2 表示「(-3) 連乘 2 次」= (-3)×(-3) = 9\n• -3^2 表示「先算 3^2 再加負號」= -(3×3) = -9\n• 反例：把 -3^2 當成 (-3)×(-3) 是常見陷阱",
    coreQ:"【核心問題 1/1】請計算 (-2)^3 + (-2)^4 的值是多少？",
    checkAns:function(v){ return v.trim()==="8"; },
    varQ:"【變化題】請計算 -2^3 + (-3)^2 的值是多少？並簡述為什麼第二項是正數。",
    varCheckAns:function(v){ return v.trim().indexOf("1")===0 || v.indexOf("= 1")!==-1 || v.indexOf("=1")!==-1; },
    reasonKw:["括號","負","正","偶數","乘"],
    diagFn:function(v){
      if(v.trim()==="-24") return "可能把 (-2)^3 和 (-2)^4 誤看成相乘或負號全數變負";
      return "可能搞混了「有括號連乘」與「無括號先乘方再變號」";
    },
    hints:{
      1:"Level 1（提醒觀念）：注意括號有沒有把負號包進去，以及奇數個負號與偶數個負號相乘的符號差異。",
      2:"Level 2（思考方向）：先分開算出 (-2)^3 與 (-2)^4 各是多少，再相加。",
      3:"Level 3（部分步驟）：(-2)^3 = -8，(-2)^4 = +16，接著算 -8 + 16。",
      4:"Level 4（完整示範）：(-2)^3 = -8，(-2)^4 = 16，-8 + 16 = 8。請輸入 8 進入變化題。"
    }
  },
  "M1-02A":{
    id:"M1-02A",
    title:"M1-02a 零指數與底數限制",
    concept:"【觀念起點】當底數 a ≠ 0 時，規定 a^0 = 1；若底數為 0（0^0）則無意義。\n• 正例：7^0 = 1、(-5)^0 = 1\n• 反例：7^0 ≠ 0；且 (x - 4)^0 = 1 成立時，x 不可等於 4",
    coreQ:"【核心問題 1/1】若 (x - 2)^0 = 1 成立，x 必須滿足什麼條件？（請寫出 x ≠ 某數）",
    checkAns:function(v){ return v.replace(/\s+/g,"").indexOf("x≠2")!==-1 || v.replace(/\s+/g,"").indexOf("x!=2")!==-1; },
    varQ:"【變化題】計算 (-9)^0 + 4^0 + 2^2 的值，並說明為什麼 (-9)^0 不是 0。",
    varCheckAns:function(v){ return v.trim().indexOf("6")===0 || v.indexOf("= 6")!==-1 || v.indexOf("=6")!==-1; },
    reasonKw:["不等於 0","不等於0","≠0","0^0","非零","1"],
    diagFn:function(v){
      if(v.indexOf("任意")!==-1 || v.indexOf("所有")!==-1) return "忽略了零指數底數不可為 0 的必要條件";
      return "尚未清楚寫出底數不能為 0 的限制條件（x ≠ 2）";
    },
    hints:{
      1:"Level 1（提醒觀念）：零指數成立的前提是「底數不能為 0」。",
      2:"Level 2（思考方向）：這題的底數是 (x - 2)，讓它不等於 0 會得到什麼條件？",
      3:"Level 3（部分步驟）：令 x - 2 ≠ 0，把 -2 移到右邊看看。",
      4:"Level 4（完整示範）：x - 2 ≠ 0 所以 x ≠ 2。請輸入 x ≠ 2 進入變化題。"
    }
  }
};

var S={
  tab:"student",
  stu:localStorage.getItem("edu_stu")||"",
  code:localStorage.getItem("edu_code")||"MATH2026",
  skillId:"M1-01A",
  phase:"core", /* core 核心題 -> var 變化題與理由 -> done 完成 */
  tries:0,
  lastDiag:"",
  msg:"",
  msgType:"good",
  mastered:JSON.parse(localStorage.getItem("edu_mastered")||"{}"),
  tName:localStorage.getItem("edu_tname")||"",
  adminOk:sessionStorage.getItem("edu_adm")==="1"
};

function esc(x){
  return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function callDb(tbl,method,q,body){
  var h={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};
  if(method==="POST") h["Prefer"]="resolution=merge-duplicates,return=representation";
  if(method==="PATCH") h["Prefer"]="return=representation";
  return fetch(SB_URL+"/rest/v1/"+tbl+(q?"?"+q:""),{
    method:method||"GET",headers:h,body:body?JSON.stringify(body):undefined
  }).then(function(r){
    return r.text().then(function(t){
      if(!r.ok) throw new Error("HTTP "+r.status+" "+t);
      return t?JSON.parse(t):null;
    });
  });
}

function syncCloud(isMastered){
  if(!S.stu.trim()) return Promise.resolve();
  var c=S.code.trim()||"MATH2026";
  var n=S.stu.trim();
  var countMastered=Object.keys(S.mastered).filter(function(k){return S.mastered[k];}).length;
  return callDb("student_progress","POST",null,[{
    id:c+"_"+n+"_"+S.skillId,
    student_name:n,
    class_code:c,
    module_id:S.skillId,
    current_stage:isMastered?6:(S.phase==="var"?4:2),
    mastery_level:isMastered?"L4":"L2",
    need_remedial:S.tries>0,
    updated_at:new Date().toISOString()
  }]).then(function(){
    S.msg="已同步雲端（目前本機已精熟 "+countMastered+" 個微技能）";
    S.msgType="good";
    render();
  }).catch(function(e){
    S.msg="雲端同步提醒："+e.message;
    S.msgType="hint";
    render();
  });
}

function logAnswer(qTxt,ansTxt,ok,errInfo,hLv){
  if(!S.stu.trim()) return Promise.resolve();
  return callDb("answer_logs","POST",null,[{
    student_name:S.stu.trim(),
    class_code:S.code.trim()||"MATH2026",
    module_id:S.skillId,
    stage:S.phase==="var"?4:2,
    prompt_text:qTxt,
    student_answer:ansTxt,
    is_correct:ok,
    error_code:errInfo||null,
    hint_level:hLv||null
  }]).catch(function(){});
}

function goTab(t){
  S.tab=t; S.msg="";
  var e=document.getElementById("err");
  if(e){e.style.display="none";e.textContent="";}
  render();
}

function pickSkill(id){
  S.skillId=id; S.phase="core"; S.tries=0; S.lastDiag=""; S.msg="";
  render();
}

function backToConcept(){
  S.phase="core"; S.tries=0;
  S.msg="已回到本微技能的觀念與反例說明，先釐清觀念再作答。";
  S.msgType="good";
  render();
}

function submitAiStep(){
  if(!S.stu.trim()){ S.msg="請先輸入學生姓名再開始學習。"; S.msgType="hint"; render(); return; }
  var inp=document.getElementById("stepInp");
  var v=inp?inp.value.trim():"";
  if(!v){ S.msg="請先輸入你的想法或答案。"; S.msgType="hint"; render(); return; }
  var sk=SKILLS[S.skillId];
  S.tries+=1;
  var lv=Math.min(S.tries,4);

  if(S.phase==="core"){
    if(sk.checkAns(v)){
      logAnswer(sk.coreQ,v,true,null,null);
      S.phase="var"; S.tries=0; S.lastDiag="";
      S.msg="核心觀念抓到了！接下來用「變化題」確認你是否能舉一反三並說出理由。";
      S.msgType="good";
      render();
      syncCloud(false);
    } else {
      var d=sk.diagFn(v);
      S.lastDiag=d;
      logAnswer(sk.coreQ,v,false,d,"Level "+lv);
      S.msg="【卡點診斷】"+d+"\n"+sk.hints[lv];
      S.msgType="hint";
      render();
    }
  } else if(S.phase==="var"){
    var okNum=sk.varCheckAns(v);
    var okReason=sk.reasonKw.some(function(k){return v.toLowerCase().indexOf(k.toLowerCase())!==-1;});
    if(okNum && okReason){
      logAnswer(sk.varQ,v,true,null,null);
      S.phase="done"; S.tries=0; S.lastDiag="";
      S.mastered[S.skillId]=true;
      localStorage.setItem("edu_mastered",JSON.stringify(S.mastered));
      S.msg="太棒了！你已通過基本觀念、變化題與理由說明，達成此微技能精熟標準！";
      S.msgType="good";
      render();
      syncCloud(true);
    } else {
      var miss=!okNum?"數值或結果還不完整":"請補上你的解題理由或觀念說明";
      logAnswer(sk.varQ,v,false,miss,"Level "+lv);
      S.msg="【還差一點】"+miss+"。提示："+(lv>=3?sk.hints[3]:sk.hints[2]);
      S.msgType="hint";
      render();
    }
  }
}

function checkTeacher(){
  var out=document.getElementById("tOut");
  var tn=(S.tName||"").trim();
  if(!tn){ out.textContent="請先輸入已核准的教師姓名"; return; }
  out.textContent="驗證中...";
  callDb("teacher_applications","GET","teacher_name=eq."+encodeURIComponent(tn)+"&order=created_at.desc&limit=1")
    .then(function(apps){
      if(!apps||!apps.length||apps[0].status!=="approved"){
        out.innerHTML="<span style='color:#b91c1c;font-weight:700'>此姓名尚未通過核准，無法查看班級資料。</span>";
        return;
      }
      Promise.all([
        callDb("student_progress","GET","order=updated_at.desc&limit=25"),
        callDb("answer_logs","GET","order=created_at.desc&limit=25")
      ]).then(function(res){
        var ps=res[0]||[],ls=res[1]||[];
        out.innerHTML="<strong>已核准教師："+esc(tn)+"</strong>\n\n學生微技能進度：\n"+
          (ps.length?ps.map(function(p){return "• "+esc(p.student_name)+"（"+esc(p.module_id)+"・"+esc(p.mastery_level)+"）";}).join("\n"):"尚無")+
          "\n\n作答與卡點診斷紀錄：\n"+
          (ls.length?ls.map(function(l){return "• "+esc(l.student_name)+"［"+esc(l.module_id)+"］「"+esc(l.student_answer)+"」→ "+(l.is_correct?"通過":("診斷："+esc(l.error_code||"")+" / "+esc(l.hint_level||"")));}).join("\n"):"尚無");
      });
    });
}

function unlockAdm(){
  var k=document.getElementById("admKey").value.trim();
  if(k===ADMIN_KEY){ S.adminOk=true; sessionStorage.setItem("edu_adm","1"); S.msg=""; render(); loadAdm(); }
  else { S.msg="密鑰錯誤"; render(); }
}

function addTeacher(){
  var nt=document.getElementById("newT").value.trim();
  if(!nt) return;
  callDb("teacher_applications","POST",null,[{teacher_name:nt,subject:"高中數學",status:"pending"}])
    .then(function(){return callDb("audit_logs","POST",null,[{action:"APPLY_TEACHER",target_info:nt}]);})
    .then(function(){loadAdm();});
}

function decideT(id,st){
  callDb("teacher_applications","PATCH","id=eq."+id,{status:st})
    .then(function(){return callDb("audit_logs","POST",null,[{action:"TEACHER_"+st.toUpperCase(),target_info:"id="+id}]);})
    .then(function(){loadAdm();});
}

function loadAdm(){
  var box=document.getElementById("admList");
  if(!box||!S.adminOk) return;
  callDb("teacher_applications","GET","order=created_at.desc&limit=25").then(function(apps){
    apps=apps||[];
    box.innerHTML="<strong>教師申請列表：</strong>\n"+(apps.length?apps.map(function(a){
      var b=a.status==="pending"
        ?" <button class='btn' style='padding:4px 8px;font-size:11px' onclick='decideT("+a.id+",\"approved\")'>核准</button> <button class='btn btn-warn' style='padding:4px 8px;font-size:11px' onclick='decideT("+a.id+",\"rejected\")'>拒絕</button>"
        :"";
      return "• "+esc(a.teacher_name)+"（"+esc(a.status)+"）"+b;
    }).join("\n"):"尚無申請");
  });
}

function render(){
  var v=document.getElementById("view");
  var sk=SKILLS[S.skillId];
  var h="";

  if(S.tab==="student"){
    h+="<label>學生姓名</label><input id='stuInp' value='"+esc(S.stu)+"' placeholder='例如：陳小華'>" +
      "<label>班級邀請碼</label><input id='codeInp' value='"+esc(S.code)+"'>" +
      "<div style='font-size:12px;font-weight:700;color:#064e3b;margin-top:4px'>M1 微技能地圖（點選切換）</div>" +
      "<div class='skill-grid'>";
    Object.keys(SKILLS).forEach(function(k){
      var item=SKILLS[k];
      var doneTag=S.mastered[k]?" ✅ 精熟":"・練習中";
      h+="<button class='sk-item "+(S.skillId===k?"active":"")+"' onclick='pickSkill(\""+k+"\")'>" +
        "<strong>"+esc(item.title)+"</strong><br><span style='opacity:0.85'>"+doneTag+"</span></button>";
    });
    h+="</div>";

    h+="<div class='box good'><strong>"+esc(sk.title)+"</strong></div>";
    h+="<div class='box'>"+esc(sk.concept)+"</div>";

    if(S.phase==="core"){
      h+="<div class='box hint'><strong>"+esc(sk.coreQ)+"</strong></div>" +
        "<input id='stepInp' placeholder='先寫出你的思考與答案（系統不會直接給答案）'>" +
        "<button class='btn' onclick='submitAiStep()'>送出回答（取得診斷或進入變化題）</button>" +
        "<button class='btn btn-soft' onclick='backToConcept()'>重看觀念與反例</button>";
    } else if(S.phase==="var"){
      h+="<div class='box hint'><strong>"+esc(sk.varQ)+"</strong></div>" +
        "<textarea id='stepInp' rows='2' placeholder='輸入變化題答案＋一句話說明理由'></textarea>" +
        "<button class='btn' onclick='submitAiStep()'>送出變化題與理由</button>" +
        "<button class='btn btn-soft' onclick='backToConcept()'>退回觀念說明</button>";
    } else {
      h+="<div class='box good'><strong>此微技能已完成！</strong>\n你已能：1. 理解概念與反例 2. 完成核心題 3. 解決變化題並說明理由。</div>" +
        "<button class='btn btn-soft' onclick='pickSkill(\""+S.skillId+"\")'>再練一次確認穩定度</button>";
    }

    if(S.msg) h+="<div class='box "+S.msgType+"'>"+esc(S.msg)+"</div>";
  } else if(S.tab==="teacher"){
    h+="<h3>教師班級（限已核准教師）</h3><label>已核准教師姓名</label><input id='tInp' value='"+esc(S.tName)+"' placeholder='輸入已核准教師姓名'>" +
      "<button class='btn' onclick='checkTeacher()'>驗證並查看班級</button><div id='tOut' class='box'>請輸入已核准教師姓名並按驗證。</div>";
  } else {
    if(!S.adminOk){
      h+="<h3>平台管理（僅限管理員）</h3><label>管理員密鑰</label><input id='admKey' type='password' placeholder='輸入管理員密鑰'>" +
        "<button class='btn' onclick='unlockAdm()'>解鎖</button>"+(S.msg?"<div class='box diag'>"+esc(S.msg)+"</div>":"");
    } else {
      h+="<div style='display:flex;justify-content:space-between;align-items:center'><strong>平台管理後台</strong><button class='btn btn-soft' onclick='S.adminOk=false;sessionStorage.removeItem(\"edu_adm\");render()'>鎖定</button></div>" +
        "<label style='margin-top:8px'>新增教師資格申請</label><input id='newT' placeholder='輸入教師姓名'><button class='btn' onclick='addTeacher()'>送出申請</button>" +
        "<div id='admList' class='box'>載入中...</div>";
    }
  }

  v.innerHTML=h;
  var si=document.getElementById("stuInp");
  if(si) si.addEventListener("input",function(e){S.stu=e.target.value;localStorage.setItem("edu_stu",S.stu);});
  var ci=document.getElementById("codeInp");
  if(ci) ci.addEventListener("input",function(e){S.code=e.target.value;localStorage.setItem("edu_code",S.code);});
  var ti=document.getElementById("tInp");
  if(ti) ti.addEventListener("input",function(e){S.tName=e.target.value;localStorage.setItem("edu_tname",S.tName);});
  if(S.tab==="admin"&&S.adminOk) loadAdm();
}

render();
</script>
</body>
</html>
