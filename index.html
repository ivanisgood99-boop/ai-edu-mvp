<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 個人化智慧教育平台 MVP</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 0 48px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
        background: #f7f9f5;
        color: #1e293b;
        line-height: 1.55;
      }
      header {
        background: #ffffff;
        border-bottom: 1px solid #d1fae5;
        padding: 12px 16px;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 12px 16px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #d1fae5;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        background: #047857;
        color: #ffffff;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
        margin: 8px 0 12px;
      }
      #err-box {
        display: none;
        padding: 12px;
        border: 1px solid #e11d48;
        background: #fff1f2;
        color: #881337;
        border-radius: 12px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div style="max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
        <div>
          <strong style="color:#064e3b;">AI 個人化教育平台</strong>
          <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:#fef3c7;color:#78350f;margin-left:6px;">雲端診斷版</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button id="go-student" class="btn">學生學習</button>
          <button id="go-teacher" class="btn" style="background:#ecfdf5;color:#065f46;">教師班級</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div id="err-box"></div>
      <div id="app" class="card">
        <h1 style="margin:0 0 8px;font-size:17px;color:#064e3b;">M1-01 正整數指數（六階段學習啟動）</h1>
        <p style="margin:0 0 8px;font-size:14px;">a^n 代表 n 個 a 連續相乘，例如 2^3 = 2 × 2 × 2 = 8。</p>
        <input id="stu-name" type="text" placeholder="輸入你的姓名（例如：陳小華）" />
        <button id="start-btn" class="btn">開始作答練習</button>
        <div id="status-msg" style="margin-top:10px;font-size:12px;color:#047857;white-space:pre-wrap;"></div>
      </div>
    </main>

    <script>
      (function () {
        var SUPABASE_URL = "https://antfbdsqrznnssdvpzcn.supabase.co";
        var SUPABASE_KEY = "sb_publishable_z7l4i49w93dZ0yrR5SPbVw_ShVGKm0J";
        var errBox = document.getElementById("err-box");

        function showErr(msg) {
          errBox.style.display = "block";
          errBox.textContent = msg;
        }

        window.onerror = function (msg, url, line) {
          showErr("Error: " + msg + (line ? " (Line " + line + ")" : ""));
        };

        async function writeProgress(name, stageNum) {
          var statusEl = document.getElementById("status-msg");
          try {
            var resp = await fetch(SUPABASE_URL + "/rest/v1/student_progress", {
              method: "POST",
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "resolution=merge-duplicates,return=representation"
              },
              body: JSON.stringify([{
                id: "MATH2026_" + name + "_M1-01",
                student_name: name,
                class_code: "MATH2026",
                module_id: "M1-01",
                current_stage: stageNum,
                mastery_level: "L2",
                updated_at: new Date().toISOString()
              }])
            });
            var text = await resp.text();
            if (!resp.ok) {
              throw new Error("HTTP " + resp.status + " -> " + text);
            }
            if (statusEl) statusEl.textContent = "已同步進度至 Supabase（學生：" + name + "，階段 " + stageNum + "）";
          } catch (e) {
            if (statusEl) statusEl.textContent = "寫入失敗：" + e.message;
            showErr("寫入 student_progress 失敗：\n" + e.message);
          }
        }

        document.getElementById("start-btn").addEventListener("click", function () {
          var nameVal = document.getElementById("stu-name").value.trim();
          if (!nameVal) {
            showErr("請先輸入學生姓名再開始。");
            return;
          }
          errBox.style.display = "none";
          document.getElementById("app").innerHTML =
            '<h2 style="margin:0 0 8px;font-size:16px;color:#064e3b;">階段二：引導與計算練習</h2>' +
            '<p style="margin:0 0 10px;font-size:14px;">你好，<strong>' + nameVal + '</strong>！請計算 2^3 + (-3)^2 的值是多少？</p>' +
            '<input id="ans-inp" type="text" placeholder="輸入答案（例如：17）" />' +
            '<button id="ans-btn" class="btn">送出答案並寫入雲端</button>' +
            '<div id="status-msg" style="margin-top:10px;font-size:12px;color:#047857;white-space:pre-wrap;"></div>';

          writeProgress(nameVal, 2);

          document.getElementById("ans-btn").addEventListener("click", async function () {
            var ans = document.getElementById("ans-inp").value.trim();
            var st = document.getElementById("status-msg");
            if (ans === "17") {
              st.textContent = "回答正確（17）！正在寫入作答紀錄...";
              var logResp = await fetch(SUPABASE_URL + "/rest/v1/answer_logs", {
                method: "POST",
                headers: {
                  "apikey": SUPABASE_KEY,
                  "Authorization": "Bearer " + SUPABASE_KEY,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify([{
                  student_name: nameVal,
                  class_code: "MATH2026",
                  module_id: "M1-01",
                  stage: 4,
                  prompt_text: "2^3 + (-3)^2",
                  student_answer: ans,
                  is_correct: true
                }])
              });
              var logText = await logResp.text();
              if (!logResp.ok) {
                showErr("寫入 answer_logs 失敗：\nHTTP " + logResp.status + " -> " + logText);
                return;
              }
              await writeProgress(nameVal, 6);
              st.textContent = "太棒了！作答與進度都已成功寫入 Supabase！";
            } else {
              st.textContent = "提示：2^3 = 8，(-3)^2 = (-3) × (-3) = 9，兩者相加是多少呢？";
            }
          });
        });

        document.getElementById("go-teacher").addEventListener("click", async function () {
          errBox.style.display = "none";
          var appEl = document.getElementById("app");
          appEl.innerHTML = '<div style="font-size:13px;">正在讀取 Supabase 雲端紀錄...</div>';
          try {
            var resp = await fetch(
              SUPABASE_URL + "/rest/v1/student_progress?order=updated_at.desc&limit=20",
              {
                headers: {
                  "apikey": SUPABASE_KEY,
                  "Authorization": "Bearer " + SUPABASE_KEY
                }
              }
            );
            var raw = await resp.text();
            if (!resp.ok) {
              throw new Error("HTTP " + resp.status + " -> " + raw);
            }
            var rows = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(rows) || rows.length === 0) {
              appEl.innerHTML =
                '<h2 style="margin:0 0 8px;font-size:16px;color:#064e3b;">教師班級紀錄</h2>' +
                '<p style="font-size:13px;color:#64748b;">連線成功（HTTP 200），但目前雲端資料表內尚無資料。請先切回「學生學習」輸入姓名並送出作答。</p>';
              return;
            }
            appEl.innerHTML =
              '<h2 style="margin:0 0 10px;font-size:16px;color:#064e3b;">教師班級紀錄（共 ' + rows.length + ' 筆）</h2>' +
              rows.map(function (r) {
                return '<div style="padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px;">' +
                  '<strong>' + (r.student_name || "") + '</strong>・' + (r.module_id || "") +
                  ' — 階段 ' + (r.current_stage || 1) + '（' + (r.mastery_level || "L1") + '）</div>';
              }).join("");
          } catch (e) {
            appEl.innerHTML = '<h2 style="margin:0 0 8px;font-size:16px;color:#881337;">讀取失敗</h2><p style="font-size:13px;">請查看上方紅框錯誤原因。</p>';
            showErr("讀取 student_progress 失敗：\n" + e.message);
          }
        });

        document.getElementById("go-student").addEventListener("click", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
