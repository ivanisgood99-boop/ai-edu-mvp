<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 個人化教育平台 - M1 驗收版</title>
  <style>
    body{margin:0;padding:16px;font-family:sans-serif;background:#f7f9f5;color:#1e293b;line-height:1.5}
    .wrap{max-width:820px;margin:0 auto}
    .card{background:#fff;border:1px solid #d1fae5;border-radius:14px;padding:16px;margin-bottom:12px}
    .btn{border:0;border-radius:8px;padding:8px 12px;background:#047857;color:#fff;font-weight:700;cursor:pointer;margin-right:6px;margin-top:6px}
    .btn-soft{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
    .btn-warn{background:#fffbeb;color:#78350f;border:1px solid #fde68a}
    input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 10px;font-size:14px}
    .box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin:10px 0;font-size:13px;white-space:pre-line}
    .good{background:#ecfdf5;border-color:#a7f3d0;color:#064e3b}
    .hint{background:#fffbeb;border-color:#fde68a;color:#78350f}
    #err{display:none;padding:10px;background:#fff1f2;border:1px solid #e11d48;color:#881337;border-radius:10px;font-size:12px;margin-bottom:12px;white-space:pre-wrap}
  </style>
  <script>
    window.onerror = function(m, u, l){
      var e = document.getElementById("err");
      if(e){ e.style.display = "block"; e.textContent = "JS錯誤: " + m + " (第" + l + "行)"; }
    };
  </script>
</head>
<body>
<div class="wrap">
  <div id="err"></div>
  <div class="card">
    <strong style="color:#064e3b">AI 個人化教育平台</strong>
    <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:#fef3c7;color:#78350f">M1 驗收版</span><br>
    <button class="btn" onclick="goTab('student')">學生學習</button>
    <button class="btn btn-soft" onclick="goTab('teacher')">教師班級</button>
    <button class="btn btn-soft" onclick="goTab('admin')">平台管理</button>
  </div>
  <div id="view" class="card">正在啟動驗收版...</div>
</div>

<script>
var SB_URL = "https://antfbdsqrznnssdvpzcn.supabase.co";
var SB_KEY = "sb_publishable_z7l4i49w93dZ0yrR5SPbVw_ShVGKm0J";
var ADMIN_KEY = "ADMIN2026";

var DATA = {
  "M1-01": {
    name: "M1-01 正整數指數",
    s1: "教材重點：\n1. a^n 代表 n 個 a 連乘（例如 2^3 = 8）。\n2. (-3)^2 = 9，但 -3^2 = -(3×3) = -9。",
    s2: "階段二（引導）：為什麼 (-2)^3 是負數，但 (-2)^4 是正數？",
    kw: ["奇數", "偶數", "負", "正", "-8", "16"],
    s3: "階段三（理解檢查）：下列哪一個與 -5^2 相等？（輸入 A、B 或 C）\nA. (-5)^2\nB. -(5×5)\nC. (-5)×2",
    a3: "B",
    s4: "階段四（互動練習）：請計算 2^3 + (-3)^2 的值是多少？",
    a4: "17",
    s5: "階段五（補救確認）：請計算 (-2)^3 + 3^2 的值是多少？",
    a5: "1",
    h1: "[H1] 先看括號包住哪些數字，再數負號個數。",
    h2: "[H2] 奇數個負號相乘為負，偶數個為正；無括號時先算次方再加負號。",
    h3: "[H3] 2^3 = 8，(-3)^2 = 9，-5^2 = -25。",
    h4: "[H4] 引導可答「奇數為負、偶數為正」；檢查選 B；練習答案為 17。"
  },
  "M1-02": {
    name: "M1-02 零指數",
    s1: "教材重點：\n1. 當底數 a ≠ 0 時，規定 a^0 = 1（例如 8^0 = 1、(-6)^0 = 1）。\n2. 0^0 無意義，底數不能為 0。",
    s2: "階段二（引導）：若有人說 8^0 = 0，你會如何用除法規律說明為什麼 8^0 = 1？",
    kw: ["除", "自己", "1", "8÷8", "8/8", "規律"],
    s3: "階段三（理解檢查）：若 (x - 3)^0 = 1 成立，x 必須滿足什麼條件？（輸入 A、B 或 C）\nA. 任意實數\nB. x ≠ 3\nC. x > 3",
    a3: "B",
    s4: "階段四（互動練習）：請計算 (-6)^0 + 2^3 - 5^0 的值是多少？",
    a4: "8",
    s5: "階段五（補救確認）：請計算 10^0 + (-2)^0 + 3^1 的值是多少？",
    a5: "5",
    h1: "[H1] 回想非零數除以自己為 1，且底數不能為 0。",
    h2: "[H2] 8^1 ÷ 8^1 = 8^0 = 1；底數 (x - 3) 不能等於 0。",
    h3: "[H3] (-6)^0 = 1，5^0 = 1，2^3 = 8。",
    h4: "[H4] 引導可答「自己除以自己為 1」；檢查選 B；練習答案為 8。"
  }
};

var S = {
  tab: "student",
  stu: localStorage.getItem("edu_stu") || "",
  code: localStorage.getItem("edu_code") || "MATH2026",
  mod: "M1-01",
  stage: 1,
  tries: 0,
  hadErr: false,
  msg: "",
  tName: localStorage.getItem("edu_tname") || "",
  adminOk: sessionStorage.getItem("edu_adm") === "1"
};

function esc(x){
  return String(x || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function callDb(tbl, method, q, body){
  var h = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };
  if(method === "POST") h["Prefer"] = "resolution=merge-duplicates,return=representation";
  if(method === "PATCH") h["Prefer"] = "return=representation";
  return fetch(SB_URL + "/rest/v1/" + tbl + (q ? "?" + q : ""), {
    method: method || "GET",
    headers: h,
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    return r.text().then(function(t){
      if(!r.ok) throw new Error("HTTP " + r.status + " " + t);
      return t ? JSON.parse(t) : null;
    });
  });
}

function saveProg(stNum, lv){
  if(!S.stu.trim()) return Promise.resolve();
  var c = S.code.trim() || "MATH2026";
  var n = S.stu.trim();
  return callDb("student_progress", "POST", null, [{
    id: c + "_" + n + "_" + S.mod,
    student_name: n,
    class_code: c,
    module_id: S.mod,
    current_stage: stNum,
    mastery_level: lv,
    need_remedial: S.hadErr,
    updated_at: new Date().toISOString()
  }]).then(function(){
    S.msg = "已同步雲端（階段 " + stNum + "）";
    render();
  }).catch(function(e){
    S.msg = "同步失敗：" + e.message;
    render();
  });
}

function saveLog(qTxt, ansTxt, ok, errC, hLv){
  if(!S.stu.trim()) return Promise.resolve();
  return callDb("answer_logs", "POST", null, [{
    student_name: S.stu.trim(),
    class_code: S.code.trim() || "MATH2026",
    module_id: S.mod,
    stage: S.stage,
    prompt_text: qTxt,
    student_answer: ansTxt,
    is_correct: ok,
    error_code: errC || null,
    hint_level: hLv || null
  }]).catch(function(){});
}

function goTab(t){
  S.tab = t;
  S.msg = "";
  var e = document.getElementById("err");
  if(e){ e.style.display = "none"; e.textContent = ""; }
  render();
}

function pickMod(m){
  S.mod = m; S.stage = 1; S.tries = 0; S.hadErr = false; S.msg = "";
  render();
}

function startS2(){
  if(!S.stu.trim()){ S.msg = "請先輸入學生姓名"; render(); return; }
  S.stage = 2; S.tries = 0;
  render();
  saveProg(2, "L1");
}

function submitStage(){
  if(!S.stu.trim()){ S.msg = "請先輸入學生姓名"; render(); return; }
  var inp = document.getElementById("ansInp");
  var v = inp ? inp.value.trim() : "";
  if(!v) return;
  var m = DATA[S.mod];
  S.tries += 1;
  var hTxt = S.tries === 1 ? m.h1 : (S.tries === 2 ? m.h2 : (S.tries === 3 ? m.h3 : m.h4));
  var hLv = "H" + Math.min(S.tries, 4);

  if(S.stage === 2){
    var ok2 = m.kw.some(function(k){ return v.toLowerCase().indexOf(k.toLowerCase()) !== -1; });
    saveLog(m.s2, v, ok2, ok2 ? null : "E01", ok2 ? null : hLv);
    if(ok2){ S.stage = 3; S.tries = 0; S.msg = "引導通過，進入階段三"; render(); saveProg(3, "L2"); }
    else { S.hadErr = true; S.msg = hTxt; render(); }
  } else if(S.stage === 3){
    var ok3 = v.toUpperCase() === m.a3;
    saveLog(m.s3, v, ok3, ok3 ? null : "E03", ok3 ? null : hLv);
    if(ok3){ S.stage = 4; S.tries = 0; S.msg = "理解檢查通過，進入階段四"; render(); saveProg(4, "L2"); }
    else { S.hadErr = true; S.msg = hTxt; render(); }
  } else if(S.stage === 4){
    var ok4 = v === m.a4;
    saveLog(m.s4, v, ok4, ok4 ? null : "E04", ok4 ? null : hLv);
    if(ok4){
      if(S.hadErr){ S.stage = 5; S.tries = 0; S.msg = "練習正確，進入階段五補救確認"; render(); saveProg(5, "L3"); }
      else { S.stage = 6; S.msg = "一次通關，完成單元（L4）"; render(); saveProg(6, "L4"); }
    } else { S.hadErr = true; S.msg = hTxt; render(); }
  } else if(S.stage === 5){
    var ok5 = v === m.a5;
    saveLog(m.s5, v, ok5, ok5 ? null : "E04", ok5 ? null : "H3");
    if(ok5){ S.stage = 6; S.msg = "補救通過，完成單元（L3）"; render(); saveProg(6, "L3"); }
    else { S.msg = "再檢查一次正負號與零指數計算"; render(); }
  }
}

function checkTeacher(){
  var out = document.getElementById("tOut");
  var tn = (S.tName || "").trim();
  if(!tn){ out.textContent = "請先輸入已核准的教師姓名"; return; }
  out.textContent = "驗證中...";
  callDb("teacher_applications", "GET", "teacher_name=eq." + encodeURIComponent(tn) + "&order=created_at.desc&limit=1")
    .then(function(apps){
      if(!apps || !apps.length || apps[0].status !== "approved"){
        out.innerHTML = "<span style='color:#b91c1c;font-weight:700'>此姓名尚未通過核准，無法查看班級資料。</span>";
        return;
      }
      Promise.all([
        callDb("student_progress", "GET", "order=updated_at.desc&limit=25"),
        callDb("answer_logs", "GET", "order=created_at.desc&limit=25")
      ]).then(function(res){
        var ps = res[0] || [], ls = res[1] || [];
        out.innerHTML = "<strong>已核准教師：" + esc(tn) + "</strong>\n\n學生進度：\n" +
          (ps.length ? ps.map(function(p){ return "• " + esc(p.student_name) + "（" + esc(p.module_id) + "・階段" + p.current_stage + "・" + esc(p.mastery_level) + "）"; }).join("\n") : "尚無") +
          "\n\n作答紀錄：\n" +
          (ls.length ? ls.map(function(l){ return "• " + esc(l.student_name) + "［S" + l.stage + "］「" + esc(l.student_answer) + "」→ " + (l.is_correct ? "正確" : ("錯誤 " + esc(l.error_code || ""))); }).join("\n") : "尚無");
      });
    });
}

function unlockAdm(){
  var k = document.getElementById("admKey").value.trim();
  if(k === ADMIN_KEY){ S.adminOk = true; sessionStorage.setItem("edu_adm", "1"); S.msg = ""; render(); loadAdm(); }
  else { S.msg = "密鑰錯誤"; render(); }
}

function addTeacher(){
  var nt = document.getElementById("newT").value.trim();
  if(!nt) return;
  callDb("teacher_applications", "POST", null, [{ teacher_name: nt, subject: "高中數學", status: "pending" }])
    .then(function(){ return callDb("audit_logs", "POST", null, [{ action: "APPLY_TEACHER", target_info: nt }]); })
    .then(function(){ loadAdm(); });
}

function decideT(id, st){
  callDb("teacher_applications", "PATCH", "id=eq." + id, { status: st })
    .then(function(){ return callDb("audit_logs", "POST", null, [{ action: "TEACHER_" + st.toUpperCase(), target_info: "id=" + id }]); })
    .then(function(){ loadAdm(); });
}

function resetProg(rowId, sName){
  callDb("student_progress", "PATCH", "id=eq." + encodeURIComponent(rowId), { current_stage: 1, mastery_level: "L1", need_remedial: false })
    .then(function(){ return callDb("audit_logs", "POST", null, [{ action: "RESET_PROGRESS", target_info: sName }]); })
    .then(function(){ loadAdm(); });
}

function loadAdm(){
  var box = document.getElementById("admList");
  if(!box || !S.adminOk) return;
  Promise.all([
    callDb("teacher_applications", "GET", "order=created_at.desc&limit=25"),
    callDb("student_progress", "GET", "order=updated_at.desc&limit=25")
  ]).then(function(res){
    var apps = res[0] || [], ps = res[1] || [];
    var h = "<strong>教師申請列表：</strong>\n" + (apps.length ? apps.map(function(a){
      var b = a.status === "pending"
        ? " <button class='btn' style='padding:4px 8px;font-size:11px' onclick='decideT(" + a.id + ",\"approved\")'>核准</button> <button class='btn btn-warn' style='padding:4px 8px;font-size:11px' onclick='decideT(" + a.id + ",\"rejected\")'>拒絕</button>"
        : "";
      return "• " + esc(a.teacher_name) + "（" + esc(a.status) + "）" + b;
    }).join("\n") : "尚無申請");
    h += "\n\n<strong>學生進度重設：</strong>\n" + (ps.length ? ps.map(function(p){
      return "• " + esc(p.student_name) + "（" + esc(p.module_id) + "・階段" + p.current_stage + "） <button class='btn btn-warn' style='padding:4px 8px;font-size:11px' onclick='resetProg(\"" + esc(p.id) + "\",\"" + esc(p.student_name) + "\")'>重設第1階段</button>";
    }).join("\n") : "尚無進度");
    box.innerHTML = h;
  });
}

function render(){
  var v = document.getElementById("view");
  var m = DATA[S.mod];
  var h = "";

  if(S.tab === "student"){
    h += "<label>學生姓名</label><input id='stuInp' value='" + esc(S.stu) + "' placeholder='例如：陳小華'>" +
      "<label>班級邀請碼</label><input id='codeInp' value='" + esc(S.code) + "'>" +
      "<button class='btn " + (S.mod==="M1-01"?"":"btn-soft") + "' onclick='pickMod(\"M1-01\")'>M1-01 正整數指數</button>" +
      "<button class='btn " + (S.mod==="M1-02"?"":"btn-soft") + "' onclick='pickMod(\"M1-02\")'>M1-02 零指數</button>" +
      "<div class='box good'><strong>" + esc(m.name) + "</strong> ・ 階段 " + S.stage + " / 6" + (S.stage > 1 ? "（教材已鎖定）" : "") + "</div>";

    if(S.stage === 1){
      h += "<div class='box'>" + esc(m.s1) + "</div><button class='btn' onclick='startS2()'>完成教材，進入階段二（不可回看）</button>";
    } else if(S.stage >= 2 && S.stage <= 5){
      var q = S.stage===2?m.s2:(S.stage===3?m.s3:(S.stage===4?m.s4:m.s5));
      h += "<div class='box'>" + esc(q) + "</div><input id='ansInp' placeholder='請輸入回答或答案'><button class='btn' onclick='submitStage()'>送出作答</button>";
    } else {
      h += "<div class='box good'>已完成本單元！精熟等級：" + (S.hadErr ? "L3" : "L4") + "</div><button class='btn btn-soft' onclick='pickMod(S.mod)'>重新測試本單元</button>";
    }
    if(S.msg) h += "<div class='box hint'>" + esc(S.msg) + "</div>";
  } else if(S.tab === "teacher"){
    h += "<h3>教師班級（限已核准教師）</h3><label>已核准教師姓名</label><input id='tInp' value='" + esc(S.tName) + "' placeholder='輸入已核准的教師姓名'>" +
      "<button class='btn' onclick='checkTeacher()'>驗證並查看班級</button><div id='tOut' class='box'>請輸入已核准教師姓名並按驗證。</div>";
  } else {
    if(!S.adminOk){
      h += "<h3>平台管理（僅限管理員）</h3><label>管理員密鑰</label><input id='admKey' type='password' placeholder='輸入管理員密鑰'>" +
        "<button class='btn' onclick='unlockAdm()'>解鎖</button>" + (S.msg ? "<div class='box hint'>" + esc(S.msg) + "</div>" : "");
    } else {
      h += "<div style='display:flex;justify-content:space-between;align-items:center'><strong>平台管理後台</strong><button class='btn btn-soft' onclick='S.adminOk=false;sessionStorage.removeItem(\"edu_adm\");render()'>鎖定</button></div>" +
        "<label style='margin-top:8px'>新增教師資格申請</label><input id='newT' placeholder='輸入教師姓名'><button class='btn' onclick='addTeacher()'>送出申請</button>" +
        "<div id='admList' class='box'>載入中...</div>";
    }
  }

  v.innerHTML = h;
  var si = document.getElementById("stuInp");
  if(si) si.addEventListener("input", function(e){ S.stu = e.target.value; localStorage.setItem("edu_stu", S.stu); });
  var ci = document.getElementById("codeInp");
  if(ci) ci.addEventListener("input", function(e){ S.code = e.target.value; localStorage.setItem("edu_code", S.code); });
  var ti = document.getElementById("tInp");
  if(ti) ti.addEventListener("input", function(e){ S.tName = e.target.value; localStorage.setItem("edu_tname", S.tName); });
  if(S.tab === "admin" && S.adminOk) loadAdm();
}

render();
</script>
</body>
</html>
