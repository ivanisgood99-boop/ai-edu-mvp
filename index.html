<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 個人化智慧教育平台 MVP</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 0 48px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
        background: #f7f9f5;
        color: #1e293b;
        line-height: 1.55;
      }
      header {
        background: #ffffff;
        border-bottom: 1px solid #d1fae5;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 12px 16px;
      }
      .header-inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        background: #ecfdf5;
        padding: 4px;
        border-radius: 12px;
      }
      .tab-btn {
        border: 0;
        background: transparent;
        color: #064e3b;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .tab-btn.active {
        background: #065f46;
        color: #ffffff;
      }
      .card {
        background: #ffffff;
        border: 1px solid #d1fae5;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        background: #047857;
        color: #ffffff;
      }
      .btn-soft {
        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
        margin: 6px 0 10px;
      }
      #err-box {
        display: none;
        margin: 12px 0;
        padding: 12px;
        border: 1px solid #e11d48;
        background: #fff1f2;
        color: #881337;
        border-radius: 12px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
    <script>
      window.__showErr = function (msg) {
        var box = document.getElementById("err-box");
        if (!box) return;
        box.style.display = "block";
        box.textContent += (box.textContent ? "\n\n" : "") + msg;
      };
      window.onerror = function (message, source, lineno) {
        window.__showErr("Error: " + message + (lineno ? " (Line " + lineno + ")" : ""));
      };
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        window.__showErr("Promise Error: " + ((r && r.message) || r || "未知錯誤"));
      });
    </script>
  </head>
  <body>
    <header>
      <div class="wrap header-inner">
        <div style="display:flex;align-items:center;gap:8px;font-weight:700;color:#064e3b;">
          <span>AI 個人化教育平台</span>
          <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:#fef3c7;color:#78350f;">規則式教學測試模式</span>
        </div>
        <div class="tabs">
          <button id="tab-student" class="tab-btn active">學生學習</button>
          <button id="tab-teacher" class="tab-btn">教師班級</button>
          <button id="tab-admin" class="tab-btn">平台管理</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div id="err-box"></div>
      <div id="app" class="card">正在啟動平台...</div>
    </main>

    <script>
      (function () {
        var SUPABASE_URL = "https://antfbdsqrznnssdvpzcn.supabase.co";
        var SUPABASE_KEY = "sb_publishable_z7l4i49w93dZ0yrR5SPbVw_ShVGKm0J";

        var MODULES = {
          "M1-01": {
            title: "M1-01 正整數指數",
            guide: "為什麼 (-2)^3 是負數，但 (-2)^4 是正數？",
            kw: ["奇數", "偶數", "負", "正", "-8", "16"],
            checkPrompt: "下列哪一個與 -5^2 相等？（輸入 A、B 或 C）\nA. (-5)^2\nB. -(5 × 5)\nC. (-5) × 2",
            checkAns: "B",
            practicePrompt: "請計算：2^3 + (-3)^2 的值是多少？",
            practiceAns: "17",
            remedialPrompt: "【補救確認題】請計算 (-2)^3 + 3^2 的值是多少？",
            remedialAns: "1"
          },
          "M1-02": {
            title: "M1-02 零指數",
            guide: "為什麼非零實數的 0 次方等於 1（例如 8^0 = 1）？",
            kw: ["除", "自己", "1", "8÷8", "8/8", "規律"],
            checkPrompt: "若 (x - 3)^0 = 1 成立，x 必須滿足什麼條件？（輸入 A、B 或 C）\nA. 任意實數\nB. x ≠ 3\nC. x > 3",
            checkAns: "B",
            practicePrompt: "請計算：(-6)^0 + 2^3 - 5^0 的值是多少？",
            practiceAns: "8",
            remedialPrompt: "【補救確認題】請計算 10^0 + (-2)^0 + 3^1 的值是多少？",
            remedialAns: "5"
          }
        };

        var state = {
          role: "student",
          name: localStorage.getItem("edu_student_name") || "",
          code: localStorage.getItem("edu_class_code") || "MATH2026",
          modId: "M1-01",
          stage: 1,
          attempts: 0,
          hadErr: false,
          msg: ""
        };

        async function api(table, method, query, body) {
          var url = SUPABASE_URL + "/rest/v1/" + table + (query ? "?" + query : "");
          var headers = {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json"
          };
          if (method === "POST") headers["Prefer"] = "resolution=merge-duplicates,return=representation";
          if (method === "PATCH") headers["Prefer"] = "return=representation";
          var res = await fetch(url, {
            method: method || "GET",
            headers: headers,
            body: body ? JSON.stringify(body) : undefined
          });
          var txt = await res.text();
          if (!res.ok) throw new Error("HTTP " + res.status + " " + txt);
          return txt ? JSON.parse(txt) : null;
        }

        async function saveProg(stageNum, mastery) {
          if (!state.name.trim()) return;
          try {
            await api("student_progress", "POST", null, [{
              id: (state.code.trim() || "MATH2026") + "_" + state.name.trim() + "_" + state.modId,
              student_name: state.name.trim(),
              class_code: state.code.trim() || "MATH2026",
              module_id: state.modId,
              current_stage: stageNum,
              mastery_level: mastery || "L1",
              need_remedial: state.hadErr,
              updated_at: new Date().toISOString()
            }]);
            state.msg = "已同步至雲端（階段 " + stageNum + "）";
          } catch (e) {
            state.msg = "同步失敗：" + e.message;
          }
          render();
        }

        async function saveLog(promptTxt, ansTxt, ok, errCode, hintLv) {
          if (!state.name.trim()) return;
          try {
            await api("answer_logs", "POST", null, [{
              student_name: state.name.trim(),
              class_code: state.code.trim() || "MATH2026",
              module_id: state.modId,
              stage: state.stage,
              prompt_text: promptTxt,
              student_answer: ansTxt,
              is_correct: ok,
              error_code: errCode || null,
              hint_level: hintLv || null
            }]);
          } catch (e) {
            state.msg = "作答紀錄寫入失敗：" + e.message;
          }
        }

        function render() {
          try {
            var app = document.getElementById("app");
            var m = MODULES[state.modId];
            var h = '<div class="card">' +
              '<label>學生姓名</label><input id="f-name" type="text" value="' + state.name.replace(/"/g, "&quot;") + '" placeholder="輸入姓名（如：陳小華）" />' +
              '<label>班級邀請碼</label><input id="f-code" type="text" value="' + state.code.replace(/"/g, "&quot;") + '" />' +
              '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">' +
              '<button id="m1" class="btn ' + (state.modId === "M1-01" ? "" : "btn-soft") + '">M1-01 正整數指數</button>' +
              '<button id="m2" class="btn ' + (state.modId === "M1-02" ? "" : "btn-soft") + '">M1-02 零指數</button>' +
              '</div>' +
              (state.msg ? '<div style="margin-top:8px;font-size:12px;color:#047857;font-weight:600;">' + state.msg + '</div>' : '') +
              '</div>';

            if (state.role === "student") {
              h += '<div class="card"><div style="font-size:12px;color:#047857;font-weight:700;">' + m.title + '・第 ' + state.stage + ' / 6 階段</div>';
              if (state.stage === 1) {
                h += '<p style="margin:8px 0 12px;">請先閱讀單元教材重點（進入下一階段後不可回看教材）。完成閱讀後按下方按鈕進入引導題。</p>' +
                  '<button id="s1-go" class="btn">進入階段二：引導問題</button>';
              } else if (state.stage === 2 || state.stage === 3 || state.stage === 4 || state.stage === 5) {
                var qText = state.stage === 2 ? m.guide
                  : state.stage === 3 ? m.checkPrompt
                  : state.stage === 4 ? m.practicePrompt
                  : m.remedialPrompt;
                h += '<p style="white-space:pre-line;font-weight:600;margin:8px 0;">' + qText + '</p>' +
                  '<input id="f-ans" type="text" placeholder="請輸入你的回答或答案" />' +
                  '<button id="ans-go" class="btn">送出作答</button>';
              } else {
                var lv = state.hadErr ? "L3" : "L4";
                h += '<h2 style="margin:8px 0;color:#064e3b;">單元學習完成！精熟等級：' + lv + '</h2>' +
                  '<p style="font-size:13px;color:#475569;">已建立第 2 天與第 7 天間隔複習排程。</p>' +
                  '<button id="restart-go" class="btn btn-soft">重新測試本單元</button>';
              }
              h += '</div>';
            } else if (state.role === "teacher") {
              h += '<div class="card"><h2 style="margin:0 0 8px;font-size:16px;">教師班級紀錄</h2><div id="t-list">正在讀取...</div></div>';
            } else {
              h += '<div class="card"><h2 style="margin:0 0 8px;font-size:16px;">平台管理與教師審核</h2>' +
                '<input id="f-tname" type="text" placeholder="輸入新教師姓名提出申請" />' +
                '<button id="t-apply" class="btn">送出申請</button><div id="a-list" style="margin-top:12px;"></div></div>';
            }

            app.innerHTML = h;
            bind();
          } catch (e) {
            window.__showErr("Render Error: " + e.message);
          }
        }

        function bind() {
          var fn = document.getElementById("f-name");
          if (fn) fn.addEventListener("input", function (e) { state.name = e.target.value; localStorage.setItem("edu_student_name", state.name); });
          var fc = document.getElementById("f-code");
          if (fc) fc.addEventListener("input", function (e) { state.code = e.target.value; localStorage.setItem("edu_class_code", state.code); });

          var m1 = document.getElementById("m1");
          var m2 = document.getElementById("m2");
          if (m1) m1.addEventListener("click", function () { state.modId = "M1-01"; state.stage = 1; state.attempts = 0; state.hadErr = false; state.msg = ""; render(); });
          if (m2) m2.addEventListener("click", function () { state.modId = "M1-02"; state.stage = 1; state.attempts = 0; state.hadErr = false; state.msg = ""; render(); });

          var s1 = document.getElementById("s1-go");
          if (s1) s1.addEventListener("click", async function () {
            if (!state.name.trim()) { state.msg = "請先輸入學生姓名"; render(); return; }
            state.stage = 2; state.attempts = 0; render();
            await saveProg(2, "L1");
          });

          var ag = document.getElementById("ans-go");
          if (ag) ag.addEventListener("click", async function () {
            if (!state.name.trim()) { state.msg = "請先輸入學生姓名"; render(); return; }
            var val = document.getElementById("f-ans").value.trim();
            if (!val) return;
            var m = MODULES[state.modId];
            state.attempts += 1;
            var hLv = ["H1", "H2", "H3", "H4"][Math.min(state.attempts - 1, 3)];

            if (state.stage === 2) {
              var ok2 = m.kw.some(function (k) { return val.toLowerCase().indexOf(k.toLowerCase()) !== -1; });
              await saveLog(m.guide, val, ok2, ok2 ? null : "E01", ok2 ? null : hLv);
              if (ok2) { state.stage = 3; state.attempts = 0; state.msg = "引導通過！"; render(); await saveProg(3, "L2"); }
              else { state.hadErr = true; state.msg = "[" + hLv + "] 試著想想底數與正負號的關係。"; render(); }
            } else if (state.stage === 3) {
              var ok3 = val.toUpperCase() === m.checkAns;
              await saveLog(m.checkPrompt, val, ok3, ok3 ? null : "E03", ok3 ? null : hLv);
              if (ok3) { state.stage = 4; state.attempts = 0; state.msg = "理解檢查通過！"; render(); await saveProg(4, "L2"); }
              else { state.hadErr = true; state.msg = "[" + hLv + "] 注意括號範圍與條件限制，正確選項是 " + m.checkAns + " 嗎？再試一次。"; render(); }
            } else if (state.stage === 4) {
              var ok4 = val === m.practiceAns;
              await saveLog(m.practicePrompt, val, ok4, ok4 ? null : "E04", ok4 ? null : hLv);
              if (ok4) {
                if (state.hadErr) { state.stage = 5; state.attempts = 0; state.msg = "進入階段五：補救確認"; render(); await saveProg(5, "L3"); }
                else { state.stage = 6; state.msg = "完成單元！"; render(); await saveProg(6, "L4"); }
              } else { state.hadErr = true; state.msg = "[" + hLv + "] 請重新計算一次次方與加減。"; render(); }
            } else if (state.stage === 5) {
              var ok5 = val === m.remedialAns;
              await saveLog(m.remedialPrompt, val, ok5, ok5 ? null : "E04", ok5 ? null : "H3");
              if (ok5) { state.stage = 6; state.msg = "補救完成並通過單元！"; render(); await saveProg(6, "L3"); }
              else { state.msg = "補救題再算一次，注意零次方與正負號。"; render(); }
            }
          });

          var rg = document.getElementById("restart-go");
          if (rg) rg.addEventListener("click", function () { state.stage = 1; state.attempts = 0; state.hadErr = false; state.msg = ""; render(); });

          var ta = document.getElementById("t-apply");
          if (ta) ta.addEventListener("click", async function () {
            var tn = document.getElementById("f-tname").value.trim();
            if (!tn) return;
            await api("teacher_applications", "POST", null, [{ teacher_name: tn, status: "pending" }]);
            loadAdmin();
          });
        }

        async function loadTeacher() {
          var box = document.getElementById("t-list");
          if (!box) return;
          try {
            var rows = await api("student_progress", "GET", "order=updated_at.desc&limit=30");
            box.innerHTML = (!rows || !rows.length) ? "尚無學生紀錄" : rows.map(function (r) {
              return '<div style="padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px;"><strong>' + r.student_name + '</strong>・' + r.module_id + ' — 階段 ' + r.current_stage + '（' + r.mastery_level + '）</div>';
            }).join("");
          } catch (e) { window.__showErr(e.message); }
        }

        async function loadAdmin() {
          var box = document.getElementById("a-list");
          if (!box) return;
          try {
            var apps = await api("teacher_applications", "GET", "order=created_at.desc&limit=20");
            box.innerHTML = (!apps || !apps.length) ? "尚無申請" : apps.map(function (a) {
              return '<div style="padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12px;"><strong>' + a.teacher_name + '</strong> — ' + a.status + '</div>';
            }).join("");
          } catch (e) { window.__showErr(e.message); }
        }

        function switchTab(r, el) {
          state.role = r;
          document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.remove("active"); });
          el.classList.add("active");
          render();
          if (r === "teacher") loadTeacher();
          if (r === "admin") loadAdmin();
        }

        document.getElementById("tab-student").addEventListener("click", function () { switchTab("student", this); });
        document.getElementById("tab-teacher").addEventListener("click", function () { switchTab("teacher", this); });
        document.getElementById("tab-admin").addEventListener("click", function () { switchTab("admin", this); });

        render();
      })();
    </script>
  </body>
</html>
