<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 個人化教育平台 - 星航學習</title>
  <link rel="stylesheet" href="./student-home.css" />
  <link rel="stylesheet" href="./teaching-engine.css" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:#f7f9f5;color:#1e293b;line-height:1.55}
    .wrap{max-width:920px;margin:0 auto}
    .card{background:#fff;border:1px solid #d1fae5;border-radius:14px;padding:16px;margin-bottom:12px}
    .btn{border:0;border-radius:8px;padding:8px 13px;background:#047857;color:#fff;font-weight:700;cursor:pointer;margin-right:6px;margin-top:6px;font-size:13px}
    .btn-soft{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
    .btn-warn{background:#fffbeb;color:#78350f;border:1px solid #fde68a}
    input,textarea{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 10px;font-size:14px;font-family:inherit}
    .box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:11px;margin:10px 0;font-size:13px;white-space:pre-line}
    .diag{background:#fff1f2;border-color:#fecdd3;color:#881337}
    #err{display:none;padding:10px;background:#fff1f2;border:1px solid #e11d48;color:#881337;border-radius:10px;font-size:12px;margin-bottom:12px;white-space:pre-wrap}
  </style>
  <script>
    window.onerror = function (m, u, l) {
      var e = document.getElementById("err");
      if (e) { e.style.display = "block"; e.textContent = "JS錯誤: " + m + " (第" + l + "行)" + (u ? " [" + u + "]" : ""); }
    };
  </script>
</head>
<body>
<div class="wrap">
  <div id="err"></div>
  <div class="card">
    <strong style="color:#064e3b">AI 個人化教育平台</strong>
    <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:#fef3c7;color:#78350f;font-weight:700">108課綱・星航學習</span><br>
    <button type="button" class="btn" onclick="goTab('student')">學生學習</button>
    <button type="button" class="btn btn-soft" onclick="goTab('teacher')">教師班級</button>
    <button type="button" class="btn btn-soft" onclick="goTab('admin')">平台管理</button>
  </div>
  <div id="view" class="card">正在啟動平台...</div>
</div>

<script src="./teaching-engine.js"></script>
<script src="./student-home.js"></script>
<script>
var SB_URL = "https://antfbdsqrznnssdvpzcn.supabase.co";
var SB_KEY = "sb_publishable_z7l4i49w93dZ0yrR5SPbVw_ShVGKm0J";
var ADMIN_KEY = "ADMIN2026";

var S = {
  tab: "student", studentView: "home", launchMode: "X-1", preferredNode: "CH2-L2",
  stu: localStorage.getItem("edu_stu") || "", code: localStorage.getItem("edu_code") || "MATH2026",
  msg: "", tName: localStorage.getItem("edu_tname") || "", adminOk: sessionStorage.getItem("edu_adm") === "1"
};

function syncPracticeTheme() {
  var isHome = S.tab === "student" && S.studentView === "home";
  var isPractice = S.tab === "student" && S.studentView === "practice";
  document.documentElement.classList.toggle("sh-home-html", isHome);
  document.body.classList.toggle("sh-home-active", isHome);
  document.documentElement.classList.toggle("te-practice-html", isPractice);
  document.body.classList.toggle("te-practice-active", isPractice);
}

function esc(x) { return String(x || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function callDb(tbl, method, q, body) {
  var h = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };
  if (method === "POST") h["Prefer"] = "resolution=merge-duplicates,return=representation";
  if (method === "PATCH") h["Prefer"] = "return=representation";
  return fetch(SB_URL + "/rest/v1/" + tbl + (q ? "?" + q : ""), { method: method || "GET", headers: h, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.text().then(function (t) { if (!r.ok) throw new Error("HTTP " + r.status + " " + t); return t ? JSON.parse(t) : null; }); });
}

function goTab(t) {
  S.tab = t; S.msg = "";
  if (t === "student") S.studentView = "home";
  var e = document.getElementById("err");
  if (e) { e.style.display = "none"; e.textContent = ""; }
  render();
}

window.__openTeachingEngineForNode = function (nodeOrLevelId, mode) {
  S.preferredNode = nodeOrLevelId || "CH2-L2";
  S.launchMode = mode || "X-1";
  S.studentView = "practice";
  S.msg = "";
  render();
};

function checkTeacher() {
  var out = document.getElementById("tOut");
  var tn = (S.tName || "").trim();
  if (!tn) { out.textContent = "請先輸入已核准的教師姓名"; return; }
  out.textContent = "驗證中...";
  callDb("teacher_applications", "GET", "teacher_name=eq." + encodeURIComponent(tn) + "&order=created_at.desc&limit=1")
    .then(function (apps) {
      if (!apps || !apps.length || apps[0].status !== "approved") {
        out.innerHTML = "<span style='color:#b91c1c;font-weight:700'>此姓名尚未通過核准，無法查看班級資料。</span>";
        return;
      }
      Promise.all([
        callDb("student_progress", "GET", "order=updated_at.desc&limit=25"),
        callDb("answer_logs", "GET", "order=created_at.desc&limit=25")
      ]).then(function (res) {
        var ps = res[0] || [], ls = res[1] || [];
        var fmtLabel = (window.TeachingEngineModule && window.TeachingEngineModule.getTeacherLabel) || function (x) { return x; };
        out.innerHTML = "<strong>已核准教師：" + esc(tn) + "</strong>\n\n學生進度：\n" +
          (ps.length ? ps.map(function (p) { return "• " + esc(p.student_name) + "（" + esc(fmtLabel(p.module_id)) + "・" + esc(p.mastery_level) + "）"; }).join("\n") : "尚無") +
          "\n\n作答紀錄：\n" +
          (ls.length ? ls.map(function (l) { return "• " + esc(l.student_name) + "［" + esc(fmtLabel(l.module_id)) + "］「" + esc(l.student_answer) + "」→ " + (l.is_correct ? "正確" : "需再釐清"); }).join("\n") : "尚無");
      });
    });
}

function unlockAdm() {
  var k = document.getElementById("admKey").value.trim();
  if (k === ADMIN_KEY) { S.adminOk = true; sessionStorage.setItem("edu_adm", "1"); S.msg = ""; render(); loadAdm(); }
  else { S.msg = "密鑰錯誤"; render(); }
}

function addTeacher() {
  var nt = document.getElementById("newT").value.trim();
  if (!nt) return;
  callDb("teacher_applications", "POST", null, [{ teacher_name: nt, subject: "高中數學", status: "pending" }])
    .then(function () { return callDb("audit_logs", "POST", null, [{ action: "APPLY_TEACHER", target_info: nt }]); })
    .then(function () { loadAdm(); });
}

function decideT(id, st) {
  callDb("teacher_applications", "PATCH", "id=eq." + id, { status: st })
    .then(function () { return callDb("audit_logs", "POST", null, [{ action: "TEACHER_" + st.toUpperCase(), target_info: "id=" + id }]); })
    .then(function () { loadAdm(); });
}

function loadAdm() {
  var box = document.getElementById("admList");
  if (!box || !S.adminOk) return;
  callDb("teacher_applications", "GET", "order=created_at.desc&limit=25").then(function (apps) {
    apps = apps || [];
    box.innerHTML = "<strong>教師申請列表：</strong>\n" + (apps.length ? apps.map(function (a) {
      var b = a.status === "pending"
        ? " <button class='btn' style='padding:4px 8px;font-size:11px' onclick='decideT(" + a.id + ",\"approved\")'>核准</button> <button class='btn btn-warn' style='padding:4px 8px;font-size:11px' onclick='decideT(" + a.id + ",\"rejected\")'>拒絕</button>"
        : "";
      return "• " + esc(a.teacher_name) + "（" + esc(a.status) + "）" + b;
    }).join("\n") : "尚無申請");
  });
}

function render() {
  syncPracticeTheme();
  var v = document.getElementById("view");
  if (!v) return;
  var h = "";

  if (S.tab === "student") {
    if (S.studentView === "home" && window.StudentHomeModule && typeof window.StudentHomeModule.render === "function") {
      window.StudentHomeModule.render(v);
      return;
    }

    var modeText = S.launchMode === "X-2" ? "刷題練習階段" : "觀念學習階段";
    h +=
      "<div class=\"te-practice-shell\">" +
      "<div class=\"te-practice-toolbar\">" +
        "<button type='button' class='te-btn secondary' onclick='S.studentView=\"home\";render()'>← 回到宇宙探索地圖</button>" +
        "<span class='te-practice-mode-badge'>目前模式：" + esc(modeText) + "</span>" +
      "</div>" +
      "<div class=\"te-practice-fields\">" +
        "<div class=\"te-practice-field\"><label for='stuInp'>學生姓名（用於區分本機學習紀錄）</label><input id='stuInp' value='" + esc(S.stu) + "' placeholder='例如：陳小華'></div>" +
        "<div class=\"te-practice-field\"><label for='codeInp'>班級邀請碼</label><input id='codeInp' value='" + esc(S.code) + "' placeholder='例如：MATH2026'></div>" +
      "</div>" +
      "<div id='te-mount'></div>" +
      "</div>";

    v.innerHTML = h;

    var si = document.getElementById("stuInp");
    if (si) {
      si.addEventListener("input", function (e) {
        S.stu = e.target.value; localStorage.setItem("edu_stu", S.stu);
        if (window.TeachingEngineModule && typeof window.TeachingEngineModule.render === "function") {
          window.TeachingEngineModule.render(document.getElementById("te-mount"), S.preferredNode);
        }
      });
    }
    var ci = document.getElementById("codeInp");
    if (ci) ci.addEventListener("input", function (e) { S.code = e.target.value; localStorage.setItem("edu_code", S.code); });
    if (window.TeachingEngineModule && typeof window.TeachingEngineModule.render === "function") {
      window.TeachingEngineModule.render(document.getElementById("te-mount"), S.preferredNode);
    }
    return;
  }

  if (S.tab === "teacher") {
    h += "<h3>教師班級（限已核准教師）</h3><label>已核准教師姓名</label><input id='tInp' value='" + esc(S.tName) + "' placeholder='輸入已核准教師姓名'><button type='button' class='btn' onclick='checkTeacher()'>驗證並查看班級</button><div id='tOut' class='box'>請輸入已核准教師姓名並按驗證。</div>";
  } else {
    if (!S.adminOk) {
      h += "<h3>平台管理（僅限管理員）</h3><label>管理員密鑰</label><input id='admKey' type='password' placeholder='輸入管理員密鑰'><button type='button' class='btn' onclick='unlockAdm()'>解鎖</button>" + (S.msg ? "<div class='box diag'>" + esc(S.msg) + "</div>" : "");
    } else {
      h += "<div style='display:flex;justify-content:space-between;align-items:center'><strong>平台管理後台</strong><button type='button' class='btn btn-soft' onclick='S.adminOk=false;sessionStorage.removeItem(\"edu_adm\");render()'>鎖定</button></div><label style='margin-top:8px'>新增教師資格申請</label><input id='newT' placeholder='輸入教師姓名'><button type='button' class='btn' onclick='addTeacher()'>送出申請</button><div id='admList' class='box'>載入中...</div>";
    }
  }

  v.innerHTML = h;
  var ti = document.getElementById("tInp");
  if (ti) ti.addEventListener("input", function (e) { S.tName = e.target.value; localStorage.setItem("edu_tname", S.tName); });
  if (S.tab === "admin" && S.adminOk) loadAdm();
}

render();
</script>
</body>
</html>
<script src="./teaching-engine.js"></script>
<script src="./student-home.js"></script>
